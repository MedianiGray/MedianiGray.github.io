<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 观照之境</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-deep: #4E7A68;
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--main); }
        .login-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            background: var(--main);
            color: white;
        }
        .btn:hover { background: var(--main-deep); }
        .switch-text { text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); }
        .switch-text a { color: var(--main); cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div id="login-form">
            <h1>登录</h1>
            <p>观照之境 · 用户登录</p>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="login-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn" onclick="login()">登录</button>
            <p class="switch-text">
                忘记密码？<a onclick="showResetPassword()">找回密码</a>
                &nbsp;·&nbsp;
                还没有账号？<a onclick="showRegister()">注册</a>
            </p>
        </div>
        <div id="register-form" style="display:none;">
            <h1>注册账号</h1>
            <p>创建普通用户账号</p>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="reg-email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>昵称（可选）</label>
                <input type="text" id="reg-username" placeholder="给自己起个名字">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="reg-password" placeholder="至少6位">
            </div>
            <button class="btn" onclick="register()">注册</button>
            <p class="switch-text">已有账号？<a onclick="showLogin()">登录</a></p>
        </div>

        <div id="reset-form" style="display:none;">
            <h1>找回密码</h1>
            <p>输入你的邮箱，我们会发送重置链接</p>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="reset-email" placeholder="your@email.com">
            </div>
            <button class="btn" onclick="resetPassword()">发送重置邮件</button>
            <p class="switch-text">想起密码了？<a onclick="showLogin()">返回登录</a></p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 检查是否已登录
        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'index.html';
        });

        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('reset-form').style.display = 'none';
        }
        function showLogin() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('reset-form').style.display = 'none';
        }
        function showResetPassword() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('reset-form').style.display = 'block';
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const { data: { user }, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                // 检查用户角色
                const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
                const role = profile?.role || 'user';
                
                if (role === 'user') {
                    // 普通用户跳转到用户中心
                    window.location.href = '/profile/';
                } else {
                    // 管理员跳转到管理后台
                    window.location.href = 'index.html';
                }
            } catch(e) {
                alert('登录失败: ' + e.message);
            }
        }

        async function register() {
            const email = document.getElementById('reg-email').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            try {
                const { data: { user }, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;
                
                // 自动创建profiles记录
                await sb.from('profiles').upsert({
                    id: user.id,
                    username: username || email.split('@')[0],
                    role: 'user'
                });
                
                alert('注册成功！请用刚才的账号登录。');
                showLogin();
            } catch(e) {
                alert('注册失败: ' + e.message);
            }
        }

        async function resetPassword() {
            const email = document.getElementById('reset-email').value;
            try {
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/profile/'
                });
                if (error) throw error;
                alert('重置邮件已发送！请检查你的邮箱。');
                showLogin();
            } catch(e) {
                alert('发送失败: ' + e.message);
            }
        }

    </script>
</body>
</html>

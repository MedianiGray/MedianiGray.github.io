<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站设置 · 元管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-deep: #4E7A68;
            --main-glow: rgba(104, 159, 137, 0.3);
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #e06c6c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            z-index: 100;
        }
        .sidebar-logo { padding: 0 1.5rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .sidebar-logo h2 { font-size: 1.2rem; color: var(--main); }
        .sidebar-logo p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1.5rem; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem; text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .nav-item.active { background: var(--main-glow); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; }
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
            cursor: pointer; font-size: 0.95rem; transition: all 0.2s;
        }
        .btn-primary { background: var(--main); color: white; }
        .btn-primary:hover { background: var(--main-deep); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .category-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .category-title {
            font-size: 1.1rem;
            color: var(--main);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.85rem; }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%; padding: 0.6rem 0.75rem; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.9rem;
        }
        .form-group input[type="color"] {
            width: 60px; height: 36px; border: none; border-radius: 8px; cursor: pointer; background: transparent;
        }
        .color-row { display: flex; align-items: center; gap: 0.75rem; }
        .color-row span { color: var(--text-muted); font-size: 0.85rem; font-family: monospace; }
        .toggle-row { display: flex; align-items: center; gap: 0.75rem; }
        .switch { position: relative; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-card-hover); border-radius: 24px; transition: 0.3s;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background: white; border-radius: 50%; transition: 0.3s;
        }
        input:checked + .slider { background: var(--main); }
        input:checked + .slider:before { transform: translateX(24px); }
        .save-bar {
            position: sticky; bottom: 0;
            background: var(--bg-secondary); border-top: 1px solid var(--border);
            padding: 1rem 2rem; display: flex; justify-content: flex-end; gap: 1rem;
            margin-left: -2rem; margin-right: -2rem; margin-bottom: -2rem;
        }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-logo p, .nav-item span { display: none; }
            .main { margin-left: 60px; padding: 1rem; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>元管理</h2>
            <p>大道元灵 · 管理后台</p>
        </div>
        <nav>
            <a class="nav-item" href="index.html"><span>📊</span><span>仪表盘</span></a>
            <a class="nav-item" href="posts.html"><span>📝</span><span>文章管理</span></a>
            <a class="nav-item" href="pages.html"><span>📄</span><span>页面内容</span></a>
            <a class="nav-item" href="comments.html"><span>💬</span><span>评论管理</span></a>
            <a class="nav-item active" href="settings.html"><span>⚙️</span><span>网站设置</span></a>
            <a class="nav-item" href="#" onclick="logout()"><span>🚪</span><span>退出登录</span></a>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <h1>网站设置</h1>
            <button class="btn btn-secondary" onclick="resetSettings()">重置</button>
        </div>
        <div id="settings-container">
            <p style="color:var(--text-muted)">加载中...</p>
        </div>
        <div class="save-bar">
            <button class="btn btn-secondary" onclick="resetSettings()">重置</button>
            <button class="btn btn-primary" onclick="saveAllSettings()">保存全部设置</button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://nxrinxhhuhtexfzkwxbu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_VyMh9BT9Tzm6uhM-Mkj5UA_WHm6ITiW";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allSettings = [];

        sb.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
        });

        async function loadSettings() {
            const container = document.getElementById('settings-container');
            try {
                const { data, error } = await sb.from('site_config').select('*').order('category');
                if (error) throw error;
                allSettings = data;
                
                // 按分类分组
                const categories = {};
                data.forEach(item => {
                    if (!categories[item.category]) categories[item.category] = [];
                    categories[item.category].push(item);
                });

                const categoryNames = {
                    'home': '门户主页',
                    'nav': '导航栏',
                    'article': '文章页',
                    'footer': '页脚',
                    'style': '视觉样式',
                    'interaction': '互动效果'
                };

                container.innerHTML = '';
                for (const [cat, items] of Object.entries(categories)) {
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.textContent = categoryNames[cat] || cat;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'form-grid';

                    items.forEach(item => {
                        const group = document.createElement('div');
                        group.className = 'form-group' + (item.type === 'text' && item.value.length > 50 ? ' full-width' : '');
                        const label = document.createElement('label');
                        label.textContent = item.description || item.key;
                        group.appendChild(label);

                        let input;
                        if (item.type === 'color') {
                            const row = document.createElement('div');
                            row.className = 'color-row';
                            input = document.createElement('input');
                            input.type = 'color';
                            input.value = item.value;
                            input.dataset.key = item.key;
                            input.dataset.type = item.type;
                            const span = document.createElement('span');
                            span.textContent = item.value;
                            input.oninput = () => span.textContent = input.value;
                            row.appendChild(input);
                            row.appendChild(span);
                            group.appendChild(row);
                        } else if (item.type === 'boolean') {
                            const row = document.createElement('div');
                            row.className = 'toggle-row';
                            const label2 = document.createElement('label');
                            label2.className = 'switch';
                            input = document.createElement('input');
                            input.type = 'checkbox';
                            input.checked = item.value === 'true';
                            input.dataset.key = item.key;
                            input.dataset.type = item.type;
                            const slider = document.createElement('span');
                            slider.className = 'slider';
                            label2.appendChild(input);
                            label2.appendChild(slider);
                            row.appendChild(label2);
                            group.appendChild(row);
                        } else if (item.type === 'number') {
                            input = document.createElement('input');
                            input.type = 'number';
                            input.value = item.value;
                            input.dataset.key = item.key;
                            input.dataset.type = item.type;
                            group.appendChild(input);
                        } else if (item.type === 'select') {
                            input = document.createElement('select');
                            input.dataset.key = item.key;
                            input.dataset.type = item.type;
                            if (item.key === 'font.title' || item.key === 'font.body') {
                                ['serif', 'sans-serif', 'monospace'].forEach(opt => {
                                    const o = document.createElement('option');
                                    o.value = opt;
                                    o.textContent = opt;
                                    if (opt === item.value) o.selected = true;
                                    input.appendChild(o);
                                });
                            }
                            group.appendChild(input);
                        } else {
                            input = document.createElement('input');
                            input.type = 'text';
                            input.value = item.value;
                            input.dataset.key = item.key;
                            input.dataset.type = item.type;
                            group.appendChild(input);
                        }

                        grid.appendChild(group);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                }
            } catch(e) {
                container.innerHTML = '<p style="color:var(--danger)">加载失败: ' + e.message + '</p>';
            }
        }

        async function saveAllSettings() {
            const inputs = document.querySelectorAll('.form-group input, .form-group select');
            try {
                for (const input of inputs) {
                    const key = input.dataset.key;
                    const type = input.dataset.type;
                    let value;
                    if (type === 'boolean') {
                        value = input.checked ? 'true' : 'false';
                    } else {
                        value = input.value;
                    }
                    await sb.from('site_config').update({ value, updated_at: new Date().toISOString() }).eq('key', key);
                }
                alert('✅ 所有设置已保存！刷新前端页面查看效果。');
            } catch(e) {
                alert('❌ 保存失败: ' + e.message);
            }
        }

        async function resetSettings() {
            if (!confirm('确定要重置所有设置为默认值吗？')) return;
            loadSettings();
        }

        async function logout() {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        }

        loadSettings();
    </script>
</body>
</html>

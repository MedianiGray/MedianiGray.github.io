<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-glow: rgba(104,159,137,0.15);
            --bg: #0a0f0e;
            --bg-secondary: #121a18;
            --bg-card: rgba(255,255,255,0.03);
            --bg-hover: rgba(255,255,255,0.06);
            --text: #e8edf2;
            --text-dim: #7a8595;
            --border: rgba(255,255,255,0.08);
            --danger: #e06c6c;
            --warning: #e0b36c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            z-index: 100;
        }
        .sidebar-logo { padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .sidebar-logo h2 {
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, var(--main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-section { padding: 16px 24px 8px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 24px; color: var(--text-dim);
            cursor: pointer; transition: all 0.2s;
            font-size: 0.9rem; text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--main-glow); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.5rem; }
        .tabs { display: flex; gap: 8px; }
        .tab {
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; color: var(--text-dim);
            background: var(--bg-card); border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .tab:hover { background: var(--bg-hover); }
        .tab.active { background: var(--main); color: white; border-color: var(--main); }
        .comments-list { display: flex; flex-direction: column; gap: 16px; }
        .comment-item {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; transition: all 0.2s;
        }
        .comment-item:hover { border-color: var(--main); }
        .comment-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .comment-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 1rem;
            background: linear-gradient(135deg, #689F89, #4E7A68);
        }
        .comment-user { flex: 1; }
        .comment-name { font-weight: 600; font-size: 0.95rem; }
        .comment-time { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
        .comment-post {
            padding: 4px 10px; border-radius: 6px;
            background: var(--bg-hover); font-size: 0.8rem; color: var(--text-dim);
        }
        .status-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 500;
        }
        .status-pending { background: rgba(224,179,108,0.15); color: var(--warning); }
        .status-approved { background: rgba(104,159,137,0.15); color: var(--main); }
        .status-spam { background: rgba(224,108,108,0.15); color: var(--danger); }
        .comment-content { font-size: 0.95rem; line-height: 1.6; margin-bottom: 16px; color: var(--text); }
        .comment-actions { display: flex; gap: 8px; }
        .action-btn {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
            background: transparent; color: var(--text-dim); cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .action-btn:hover { background: var(--bg-hover); color: var(--text); }
        .action-btn.warning:hover { border-color: var(--warning); color: var(--warning); }
        .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .loading { text-align: center; padding: 40px; color: var(--text-dim); }
        .toast {
            position: fixed; top: 80px; right: 32px;
            background: var(--main); color: white;
            padding: 12px 24px; border-radius: 10px;
            font-size: 0.9rem; z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h2>🌌 造物工作台</h2>
    </div>
    <div class="nav-section">概览</div>
    <a href="/admin/" class="nav-item">📊 仪表盘</a>
    <div class="nav-section">内容管理</div>
    <a href="/admin/posts/" class="nav-item">📝 文章管理</a>
    <a href="/admin/comments/" class="nav-item active">💬 评论管理</a>
    <a href="/admin/pages/" class="nav-item">📄 页面管理</a>
    <div class="nav-section">用户</div>
    <a href="/admin/users/" class="nav-item">👥 用户管理</a>
    <div class="nav-section">系统</div>
    <a href="/admin/settings/" class="nav-item">⚙️ 系统设置</a>
    <a href="/home/" class="nav-item">🏠 返回门廊</a>
</aside>

<main class="main">
    <div class="header">
        <h1>评论管理</h1>
        <div class="tabs">
            <div class="tab active" onclick="switchTab(this, 'pending')">待审核 (<span id="count-pending">0</span>)</div>
            <div class="tab" onclick="switchTab(this, 'approved')">已通过 (<span id="count-approved">0</span>)</div>
            <div class="tab" onclick="switchTab(this, 'all')">全部</div>
        </div>
    </div>

    <div class="comments-list" id="comments-list">
        <div class="loading">加载中...</div>
    </div>
</main>

<script>
const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'pending';
let allComments = [];

window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.href = '/admin/login.html';
        return;
    }
    await loadCounts();
    await loadComments();
});

async function loadCounts() {
    try {
        const { count: pending } = await sb.from('comments').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        const { count: approved } = await sb.from('comments').select('*', { count: 'exact', head: true }).eq('status', 'approved');
        document.getElementById('count-pending').textContent = pending || 0;
        document.getElementById('count-approved').textContent = approved || 0;
    } catch(e) {
        console.error('加载数量失败:', e);
    }
}

async function loadComments() {
    const list = document.getElementById('comments-list');
    list.innerHTML = '<div class="loading">加载中...</div>';
    
    try {
        let query = sb.from('comments').select('*, posts(title)').order('created_at', { ascending: false });
        
        if (currentTab !== 'all') {
            query = query.eq('status', currentTab);
        }
        
        const { data, error } = await query;
        if (error) throw error;
        
        allComments = data || [];
        renderComments();
    } catch(e) {
        console.error('加载评论失败:', e);
        list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请刷新重试</p></div>';
    }
}

function renderComments() {
    const list = document.getElementById('comments-list');
    
    if (allComments.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>暂无评论</p></div>';
        return;
    }
    
    list.innerHTML = allComments.map(comment => {
        const username = '匿名用户';
        const postTitle = comment.posts?.title || '未知文章';
        const avatarChar = username.charAt(0);
        const timeAgo = formatTime(comment.created_at);
        const statusText = { pending: '待审核', approved: '已通过', spam: '垃圾' }[comment.status] || comment.status;
        
        let actions = '';
        if (comment.status === 'pending') {
            actions = `
                <button class="action-btn" onclick="approveComment('${comment.id}')">通过</button>
                <button class="action-btn warning" onclick="markSpam('${comment.id}')">标记垃圾</button>
                <button class="action-btn danger" onclick="deleteComment('${comment.id}')">删除</button>
            `;
        } else if (comment.status === 'approved') {
            actions = `
                <button class="action-btn warning" onclick="markSpam('${comment.id}')">标记垃圾</button>
                <button class="action-btn danger" onclick="deleteComment('${comment.id}')">删除</button>
            `;
        } else {
            actions = `
                <button class="action-btn" onclick="approveComment('${comment.id}')">恢复</button>
                <button class="action-btn danger" onclick="deleteComment('${comment.id}')">删除</button>
            `;
        }
        
        return `
            <div class="comment-item">
                <div class="comment-header">
                    <div class="comment-avatar">${avatarChar}</div>
                    <div class="comment-user">
                        <div class="comment-name">${escapeHtml(username)}</div>
                        <div class="comment-time">${timeAgo}</div>
                    </div>
                    <span class="comment-post">${escapeHtml(postTitle)}</span>
                    <span class="status-badge status-${comment.status}">${statusText}</span>
                </div>
                <div class="comment-content">${escapeHtml(comment.content)}</div>
                <div class="comment-actions">${actions}</div>
            </div>
        `;
    }).join('');
}

function switchTab(el, tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentTab = tabName;
    loadComments();
}

async function approveComment(id) {
    try {
        const { error } = await sb.from('comments').update({ status: 'approved', updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        showToast('评论已通过');
        await loadCounts();
        await loadComments();
    } catch(e) {
        showToast('操作失败: ' + e.message);
    }
}

async function markSpam(id) {
    try {
        const { error } = await sb.from('comments').update({ status: 'spam', updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        showToast('已标记为垃圾');
        await loadCounts();
        await loadComments();
    } catch(e) {
        showToast('操作失败: ' + e.message);
    }
}

async function deleteComment(id) {
    if (!confirm('确定删除这条评论吗？此操作不可恢复。')) return;
    try {
        const { error } = await sb.from('comments').delete().eq('id', id);
        if (error) throw error;
        showToast('评论已删除');
        await loadCounts();
        await loadComments();
    } catch(e) {
        showToast('删除失败: ' + e.message);
    }
}

function formatTime(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
    return date.toLocaleDateString('zh-CN');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理 · 元管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-deep: #4E7A68;
            --main-glow: rgba(104, 159, 137, 0.3);
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #e06c6c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            z-index: 100;
        }
        .sidebar-logo { padding: 0 1.5rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .sidebar-logo h2 { font-size: 1.2rem; color: var(--main); }
        .sidebar-logo p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1.5rem; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem; text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .nav-item.active { background: var(--main-glow); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; }
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
            cursor: pointer; font-size: 0.95rem; transition: all 0.2s;
        }
        .btn-primary { background: var(--main); color: white; }
        .btn-primary:hover { background: var(--main-deep); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-danger { background: rgba(224, 108, 108, 0.15); color: var(--danger); border: 1px solid rgba(224, 108, 108, 0.3); }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; }
        tr:hover { background: var(--bg-card-hover); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 2rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-secondary); border-radius: 16px; padding: 2rem;
            width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.75rem; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.95rem;
        }
        .form-group textarea { min-height: 200px; font-family: monospace; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-logo p, .nav-item span { display: none; }
            .main { margin-left: 60px; padding: 1rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>元管理</h2>
            <p>大道元灵 · 管理后台</p>
        </div>
        <nav>
            <a class="nav-item" href="index.html"><span>📊</span><span>仪表盘</span></a>
            <a class="nav-item active" href="posts.html"><span>📝</span><span>文章管理</span></a>
            <a class="nav-item" href="pages.html"><span>📄</span><span>页面内容</span></a>
            <a class="nav-item" href="comments.html"><span>💬</span><span>评论管理</span></a>
            <a class="nav-item" href="settings.html"><span>⚙️</span><span>网站设置</span></a>
            <a class="nav-item" href="#" onclick="logout()"><span>🚪</span><span>退出登录</span></a>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <h1>文章管理</h1>
            <button class="btn btn-primary" onclick="openPostModal()">+ 新建文章</button>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>分类</th>
                        <th>浏览</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="posts-body">
                    <tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal" id="post-modal">
        <div class="modal-content">
            <h2 id="modal-title">编辑文章</h2>
            <input type="hidden" id="post-id">
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="post-title" placeholder="文章标题">
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="post-category" placeholder="分类">
            </div>
            <div class="form-group">
                <label>摘要</label>
                <input type="text" id="post-excerpt" placeholder="文章摘要">
            </div>
            <div class="form-group">
                <label>内容 (Markdown)</label>
                <textarea id="post-content" placeholder="支持Markdown语法"></textarea>
            </div>
            <div style="display:flex;gap:1rem;">
                <button class="btn btn-primary" onclick="savePost()">保存</button>
                <button class="btn btn-secondary" onclick="closePostModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        sb.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
        });

        async function loadPosts() {
            const tbody = document.getElementById('posts-body');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>';
            try {
                const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">暂无文章</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(post => {
                    const tr = document.createElement('tr');
                    const date = new Date(post.created_at).toLocaleDateString('zh-CN');
                    tr.innerHTML = `
                        <td>${post.title}</td>
                        <td>${post.category}</td>
                        <td>${post.views || 0}</td>
                        <td>${date}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick='editPost(${JSON.stringify(post)})'>编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deletePost('${post.id}')">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger)">加载失败: ' + e.message + '</td></tr>';
            }
        }

        function openPostModal() {
            document.getElementById('modal-title').textContent = '新建文章';
            document.getElementById('post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('post-excerpt').value = '';
            document.getElementById('post-content').value = '';
            document.getElementById('post-modal').classList.add('active');
        }

        function editPost(post) {
            document.getElementById('modal-title').textContent = '编辑文章';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-category').value = post.category || '';
            document.getElementById('post-excerpt').value = post.excerpt || '';
            document.getElementById('post-content').value = post.content;
            document.getElementById('post-modal').classList.add('active');
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.remove('active');
        }

        async function savePost() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            const excerpt = document.getElementById('post-excerpt').value;
            const content = document.getElementById('post-content').value;
            if (!title || !content) { alert('标题和内容不能为空'); return; }
            const slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
            try {
                if (id) {
                    await sb.from('posts').update({ title, category, excerpt, content, updated_at: new Date().toISOString() }).eq('id', id);
                } else {
                    await sb.from('posts').insert([{ title, slug, category, excerpt, content }]);
                }
                closePostModal();
                loadPosts();
                alert('保存成功');
            } catch(e) { alert('保存失败: ' + e.message); }
        }

        async function deletePost(id) {
            if (!confirm('确定删除这篇文章？')) return;
            try {
                await sb.from('posts').delete().eq('id', id);
                loadPosts();
            } catch(e) { alert('删除失败: ' + e.message); }
        }

        async function logout() {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        }

        loadPosts();
    </script>
</body>
</html>

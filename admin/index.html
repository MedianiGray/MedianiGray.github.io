<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 · 元管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-deep: #4E7A68;
            --main-glow: rgba(104, 159, 137, 0.3);
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #e06c6c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            z-index: 100;
        }
        .sidebar-logo {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .sidebar-logo h2 { font-size: 1.2rem; color: var(--main); }
        .sidebar-logo p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .nav-item.active { background: var(--main-glow); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn:hover { background: var(--bg-card-hover); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .stat-card .label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--main); }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-logo p, .nav-item span { display: none; }
            .main { margin-left: 60px; padding: 1rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>元管理</h2>
            <p>大道元灵 · 管理后台</p>
        </div>
        <nav>
            <a class="nav-item active" href="index.html"><span>📊</span><span>仪表盘</span></a>
            <a class="nav-item" href="posts.html"><span>📝</span><span>文章管理</span></a>
            <a class="nav-item" href="pages.html"><span>📄</span><span>页面内容</span></a>
            <a class="nav-item" href="comments.html"><span>💬</span><span>评论管理</span></a>
            <a class="nav-item" href="settings.html"><span>⚙️</span><span>网站设置</span></a>
            <a class="nav-item" href="#" onclick="logout()"><span>🚪</span><span>退出登录</span></a>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <h1>仪表盘</h1>
            <button class="btn" onclick="loadStats()">刷新</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">文章总数</div>
                <div class="value" id="stat-posts">-</div>
            </div>
            <div class="stat-card">
                <div class="label">总访问量</div>
                <div class="value" id="stat-visits">-</div>
            </div>
            <div class="stat-card">
                <div class="label">评论数</div>
                <div class="value" id="stat-comments">-</div>
            </div>
            <div class="stat-card">
                <div class="label">总点赞</div>
                <div class="value" id="stat-likes">-</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 检查登录
        sb.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
        });

        async function loadStats() {
            try {
                const { count: postCount } = await sb.from('posts').select('*', { count: 'exact', head: true });
                document.getElementById('stat-posts').textContent = postCount || 0;

                const { count: visitCount } = await sb.from('visits').select('*', { count: 'exact', head: true });
                document.getElementById('stat-visits').textContent = visitCount || 0;

                const { count: commentCount } = await sb.from('comments').select('*', { count: 'exact', head: true });
                document.getElementById('stat-comments').textContent = commentCount || 0;

                const { count: likeCount } = await sb.from('likes').select('*', { count: 'exact', head: true });
                document.getElementById('stat-likes').textContent = likeCount || 0;
            } catch(e) {
                console.log('统计加载失败:', e);
            }
        }

        async function logout() {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        }

        loadStats();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-glow: rgba(104,159,137,0.15);
            --bg: #0a0f0e;
            --bg-secondary: #121a18;
            --bg-card: rgba(255,255,255,0.03);
            --bg-hover: rgba(255,255,255,0.06);
            --text: #e8edf2;
            --text-dim: #7a8595;
            --border: rgba(255,255,255,0.08);
            --danger: #e06c6c;
            --warning: #e0b36c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            z-index: 100;
        }
        .sidebar-logo { padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .sidebar-logo h2 {
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, var(--main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-section { padding: 16px 24px 8px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 24px; color: var(--text-dim);
            cursor: pointer; transition: all 0.2s;
            font-size: 0.9rem; text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--main-glow); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.5rem; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .search-box {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text); font-size: 0.9rem; width: 200px;
        }
        .search-box:focus { outline: none; border-color: var(--main); }
        .btn {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text); cursor: pointer;
            font-size: 0.9rem; transition: all 0.2s;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--main); border-color: var(--main); color: white; }
        .btn-primary:hover { background: #5a8f79; }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .user-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; transition: all 0.2s;
        }
        .user-card:hover { border-color: var(--main); }
        .user-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 1.2rem;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; font-size: 1rem; }
        .user-email { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
        .role-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 500;
        }
        .role-super { background: rgba(154,104,159,0.15); color: #b080c0; }
        .role-admin { background: rgba(100,150,200,0.15); color: #7aa6d0; }
        .role-user { background: rgba(104,159,137,0.15); color: var(--main); }
        .role-banned { background: rgba(224,108,108,0.15); color: var(--danger); }
        .user-stats { display: flex; gap: 16px; margin-bottom: 16px; padding: 12px; background: var(--bg-hover); border-radius: 8px; }
        .user-stat { flex: 1; text-align: center; }
        .user-stat-num { font-size: 1.2rem; font-weight: 600; color: var(--main); }
        .user-stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        .user-actions { display: flex; gap: 8px; }
        .action-btn {
            flex: 1; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: transparent; color: var(--text-dim); cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .action-btn:hover { background: var(--bg-hover); color: var(--text); }
        .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); grid-column: 1/-1; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .loading { text-align: center; padding: 40px; color: var(--text-dim); grid-column: 1/-1; }
        .toast {
            position: fixed; top: 80px; right: 32px;
            background: var(--main); color: white;
            padding: 12px 24px; border-radius: 10px;
            font-size: 0.9rem; z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw;
        }
        .modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
        .modal-field { margin-bottom: 16px; }
        .modal-field label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-dim); }
        .modal-field select, .modal-field input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text); font-size: 0.9rem;
        }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h2>🌌 造物工作台</h2>
    </div>
    <div class="nav-section">概览</div>
    <a href="/admin/" class="nav-item">📊 仪表盘</a>
    <div class="nav-section">内容管理</div>
    <a href="/admin/posts/" class="nav-item">📝 文章管理</a>
    <a href="/admin/comments/" class="nav-item">💬 评论管理</a>
    <a href="/admin/pages/" class="nav-item">📄 页面管理</a>
    <div class="nav-section">用户</div>
    <a href="/admin/users/" class="nav-item active">👥 用户管理</a>
    <div class="nav-section">系统</div>
    <a href="/admin/settings/" class="nav-item">⚙️ 系统设置</a>
    <a href="/home/" class="nav-item">🏠 返回门廊</a>
</aside>

<main class="main">
    <div class="header">
        <h1>用户管理</h1>
        <div class="header-actions">
            <input type="text" class="search-box" placeholder="搜索用户..." oninput="searchUsers(this.value)">
        </div>
    </div>

    <div class="users-grid" id="usersGrid">
        <div class="loading">加载中...</div>
    </div>
</main>

<div id="modalContainer"></div>

<script>
const supabaseUrl = 'https://xyxrwstdhmauwrbrojnr.supabase.co';
const supabaseKey = 'sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG';
const sb = supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;
let allUsers = [];

window.addEventListener('DOMContentLoaded', init);

async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) {
        showToast('请先登录');
        setTimeout(() => window.location.href = '/admin/login.html', 1500);
        return;
    }
    currentUser = user;
    await loadUsers();
}

async function loadUsers() {
    const grid = document.getElementById('usersGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';
    
    try {
        const { data, error } = await sb
            .from('profiles')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        allUsers = data || [];
        renderUsers(allUsers);
    } catch (e) {
        console.error('加载用户失败:', e);
        grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败：' + escapeHtml(e.message) + '</p></div>';
    }
}

function searchUsers(keyword) {
    if (!keyword.trim()) {
        renderUsers(allUsers);
        return;
    }
    const lower = keyword.toLowerCase();
    const filtered = allUsers.filter(u => 
        (u.username && u.username.toLowerCase().includes(lower)) ||
        (u.email && u.email.toLowerCase().includes(lower))
    );
    renderUsers(filtered);
}

function renderUsers(users) {
    const grid = document.getElementById('usersGrid');
    if (users.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>暂无用户</p></div>';
        return;
    }
    
    const roleColors = {
        'super_admin': 'linear-gradient(135deg, #9a689f, #7a487f)',
        'admin': 'linear-gradient(135deg, #6496c8, #4476a8)',
        'user': 'linear-gradient(135deg, #689F89, #487f69)',
        'banned': 'linear-gradient(135deg, #e06c6c, #c04c4c)'
    };
    const roleTexts = {
        'super_admin': '超级管理员',
        'admin': '管理员',
        'user': '普通用户',
        'banned': '已封禁'
    };
    const roleClasses = {
        'super_admin': 'role-super',
        'admin': 'role-admin',
        'user': 'role-user',
        'banned': 'role-banned'
    };
    
    grid.innerHTML = users.map(user => {
        const username = user.username || '匿名用户';
        const role = user.role || 'user';
        const avatarChar = username.charAt(0).toUpperCase();
        const email = user.email || '';
        const isBanned = role === 'banned';
        
        return `
        <div class="user-card">
            <div class="user-header">
                <div class="user-avatar" style="background: ${roleColors[role] || roleColors['user']};">${avatarChar}</div>
                <div class="user-info">
                    <div class="user-name">${escapeHtml(username)}</div>
                    <div class="user-email">${escapeHtml(email)}</div>
                </div>
                <span class="role-badge ${roleClasses[role] || 'role-user'}">${roleTexts[role] || '普通用户'}</span>
            </div>
            <div class="user-stats">
                <div class="user-stat">
                    <div class="user-stat-num">${user.points || 0}</div>
                    <div class="user-stat-label">积分</div>
                </div>
                <div class="user-stat">
                    <div class="user-stat-num">${user.level || 1}</div>
                    <div class="user-stat-label">等级</div>
                </div>
                <div class="user-stat">
                    <div class="user-stat-num">${formatDate(user.created_at)}</div>
                    <div class="user-stat-label">注册</div>
                </div>
            </div>
            <div class="user-actions">
                <button class="action-btn" onclick="viewUser('${user.id}')">详情</button>
                <button class="action-btn" onclick="editUserRole('${user.id}', '${role}')">编辑</button>
                ${isBanned 
                    ? `<button class="action-btn" onclick="unbanUser('${user.id}')">解封</button>`
                    : `<button class="action-btn danger" onclick="banUser('${user.id}')">封禁</button>`
                }
            </div>
        </div>
        `;
    }).join('');
}

function viewUser(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;
    
    const roleTexts = {
        'super_admin': '超级管理员',
        'admin': '管理员',
        'user': '普通用户',
        'banned': '已封禁'
    };
    
    showModal(`
        <h3>用户详情</h3>
        <div class="modal-field">
            <label>用户名</label>
            <input type="text" value="${escapeHtml(user.username || '')}" readonly>
        </div>
        <div class="modal-field">
            <label>邮箱</label>
            <input type="text" value="${escapeHtml(user.email || '')}" readonly>
        </div>
        <div class="modal-field">
            <label>角色</label>
            <input type="text" value="${roleTexts[user.role] || user.role}" readonly>
        </div>
        <div class="modal-field">
            <label>积分</label>
            <input type="text" value="${user.points || 0}" readonly>
        </div>
        <div class="modal-field">
            <label>等级</label>
            <input type="text" value="${user.level || 1}" readonly>
        </div>
        <div class="modal-field">
            <label>注册时间</label>
            <input type="text" value="${formatDate(user.created_at)}" readonly>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">关闭</button>
        </div>
    `);
}

function editUserRole(userId, currentRole) {
    showModal(`
        <h3>编辑用户角色</h3>
        <div class="modal-field">
            <label>选择角色</label>
            <select id="newRole">
                <option value="user" ${currentRole === 'user' ? 'selected' : ''}>普通用户</option>
                <option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>管理员</option>
                <option value="super_admin" ${currentRole === 'super_admin' ? 'selected' : ''}>超级管理员</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveUserRole('${userId}')">保存</button>
        </div>
    `);
}

async function saveUserRole(userId) {
    const newRole = document.getElementById('newRole').value;
    try {
        const { error } = await sb.from('profiles').update({ role: newRole, updated_at: new Date().toISOString() }).eq('id', userId);
        if (error) throw error;
        showToast('角色已更新');
        closeModal();
        await loadUsers();
    } catch(e) {
        showToast('更新失败: ' + e.message);
    }
}

async function banUser(userId) {
    if (!confirm('确定封禁该用户吗？封禁后用户将无法登录。')) return;
    try {
        const { error } = await sb.from('profiles').update({ role: 'banned', updated_at: new Date().toISOString() }).eq('id', userId);
        if (error) throw error;
        showToast('用户已封禁');
        await loadUsers();
    } catch(e) {
        showToast('封禁失败: ' + e.message);
    }
}

async function unbanUser(userId) {
    try {
        const { error } = await sb.from('profiles').update({ role: 'user', updated_at: new Date().toISOString() }).eq('id', userId);
        if (error) throw error;
        showToast('用户已解封');
        await loadUsers();
    } catch(e) {
        showToast('解封失败: ' + e.message);
    }
}

function showModal(html) {
    const container = document.getElementById('modalContainer');
    container.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

function closeModal() {
    document.getElementById('modalContainer').innerHTML = '';
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    const date = new Date(dateStr);
    return date.toLocaleDateString('zh-CN');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面内容 · 造物工作台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar-logo { padding: 0 1.5rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .sidebar-logo h2 { font-size: 1.2rem; color: var(--main); }
        .sidebar-logo p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1.5rem; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem; text-decoration: none;
        }
        .nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(104, 159, 137, 0.2); color: var(--main); border-right: 2px solid var(--main); }
        .main { margin-left: 240px; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; }
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
            cursor: pointer; font-size: 0.95rem; background: var(--bg-card);
            color: var(--text-primary); border: 1px solid var(--border);
        }
        .placeholder-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
        }
        .placeholder-card .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        .placeholder-card h2 { margin-bottom: 1rem; color: var(--text-primary); }
        .placeholder-card p { color: var(--text-secondary); line-height: 1.8; max-width: 500px; margin: 0 auto; }
        @media (max-width: 992px) {
            .sidebar { width: 70px; }
            .sidebar-logo { padding: 1rem; text-align: center; }
            .sidebar-logo h2 { display: none; }
            .sidebar-logo p { display: none; }
            .nav-item { justify-content: center; padding: 0.8rem 0; }
            .nav-text { display: none !important; }
            .main { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>造物工作台</h2>
            <p>观照之境 · 管理后台</p>
        </div>
        <nav>
            <a class="nav-item" href="index.html"><span>📊</span><span class="nav-text">仪表盘</span></a>
            <a class="nav-item" href="posts.html"><span>📝</span><span class="nav-text">文章管理</span></a>
            <a class="nav-item active" href="pages.html"><span>📄</span><span class="nav-text">页面内容</span></a>
            <a class="nav-item " href="comments.html"><span>💬</span><span class="nav-text">评论管理</span></a>
            <a class="nav-item super-only" href="users.html" style="display:none"><span>👥</span><span class="nav-text">用户管理</span></a>
            <a class="nav-item super-only " href="settings.html" style="display:none"><span>⚙️</span><span class="nav-text">网站设置</span></a>
            <a class="nav-item" href="#" onclick="logout()"><span>🚪</span><span class="nav-text">退出登录</span></a>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <h1>📄 页面内容</h1>
            <button class="btn" onclick="history.back()">返回</button>
        </div>
        
        <div class="placeholder-card">
            <div class="icon">📄</div>
            <h2></h2>
            <p>该模块正在开发中，将在后续阶段上线。<br><br>
            当前版本已完成：<br>
            ✅ 三级权限系统<br>
            ✅ 门廊主页 9 扇门<br>
            ✅ 统一设计系统<br>
            ✅ 用户管理（超级管理员）<br>
            ⬜ 在线文章编辑<br>
            ⬜ 评论审核<br>
            ⬜ 全站可视化设置
            </p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        sb.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            
            const { data: profile } = await sb.from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();
            
            if (profile) {
                const role = profile.role;
                if (role !== 'admin' && role !== 'super_admin') {
                    alert('您没有权限访问管理后台');
                    window.location.href = '/profile/';
                    return;
                }
                if (role === 'super_admin') {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'flex');
                }
            }
        });

        async function logout() {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

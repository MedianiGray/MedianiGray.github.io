<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大道元灵 · 元门户</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --bg: #0a0e14;
  --text: #e0e6ed;
  --text-dim: #8892a0;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  overflow-x: hidden;
  min-height: 100vh;
}
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
}
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: -1;
}
.glow-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(104,159,137,0.12), transparent 70%);
  top: -200px; left: -150px;
}
.glow-2 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(100,150,200,0.08), transparent 70%);
  bottom: -250px; right: -200px;
}
.cursor-glow {
  position: fixed;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(104,159,137,0.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
  transform: translate(-50%, -50%);
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}
.brand {
  text-align: center;
  margin-bottom: 20px;
  color: var(--main);
  font-size: 0.9rem;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  opacity: 0.7;
}
.hero {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  perspective: 1000px;
}
.hero h1 {
  font-size: clamp(3rem, 10vw, 6rem);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #fff, var(--main));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero .slogan {
  font-size: 1.1rem;
  color: var(--text-dim);
  max-width: 500px;
  line-height: 2;
  margin-bottom: 10px;
  font-style: italic;
}
.hero .sub {
  font-size: 0.9rem;
  color: var(--text-dim);
  opacity: 0.6;
  margin-bottom: 50px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
  margin: 60px 0;
}
.card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 36px 28px;
  backdrop-filter: blur(20px);
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.4s, border-color 0.4s;
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  display: block;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--main), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}
.card:hover::before { opacity: 1; }
.card:hover {
  box-shadow: 0 20px 60px rgba(104,159,137,0.12);
  border-color: rgba(104,159,137,0.3);
}
.card-icon {
  font-size: 2.5rem;
  margin-bottom: 16px;
}
.card h3 {
  font-size: 1.3rem;
  margin-bottom: 10px;
  color: var(--main);
  letter-spacing: 0.05em;
}
.card p {
  color: var(--text-dim);
  line-height: 1.7;
  font-size: 0.9rem;
}
.card .tag {
  display: inline-block;
  margin-top: 14px;
  padding: 4px 12px;
  background: rgba(104,159,137,0.1);
  border-radius: 100px;
  font-size: 0.75rem;
  color: var(--main);
}
.char {
  display: inline-block;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s, transform 0.4s;
}
.char.visible {
  opacity: 1;
  transform: translateY(0);
}
.fade-in {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.6s, transform 0.6s;
}
.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}
.footer {
  text-align: center;
  padding: 40px 0;
  color: var(--text-dim);
  font-size: 0.85rem;
  opacity: 0.5;
}
@media (max-width: 768px) {
  .cards { grid-template-columns: 1fr; }
}
</style>

<script>
// 3D粒子空间背景
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '-2';
renderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(renderer.domElement);

// 创建粒子
const geometry = new THREE.BufferGeometry();
const count = 2000;
const positions = new Float32Array(count * 3);
for (let i = 0; i < count * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 100;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const material = new THREE.PointsMaterial({
  color: 0x689F89,
  size: 0.15,
  transparent: true,
  opacity: 0.6,
});
const particles = new THREE.Points(geometry, material);
scene.add(particles);

camera.position.z = 30;

// 鼠标移动视差
let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5);
  mouseY = (e.clientY / window.innerHeight - 0.5);
});

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  particles.rotation.y += 0.0005;
  particles.rotation.x += 0.0002;
  camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
  camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
  camera.lookAt(scene.position);
  renderer.render(scene, camera);
}
animate();

// 窗口大小
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
<\/script>
</body>
</html>

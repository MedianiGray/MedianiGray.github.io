<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-glow: rgba(104,159,137,0.4);
  --bg: #07090d;
  --text: #e8edf2;
  --text-dim: #7a8595;
  --glass: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.06);
  --card-bg: rgba(12,16,24,0.6);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', 'Georgia', serif;
  overflow-x: hidden;
  min-height: 100vh;
  perspective: 1200px;
}
/* 绮掑瓙鐢诲竷 */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -2;
}
/* 鑳屾櫙鍏夋枒 */
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  z-index: -1;
  transition: transform 0.8s cubic-bezier(0.2,0.8,0.2,1);
}
.glow-1 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, var(--main-glow), transparent 70%);
  top: -200px; left: -150px;
  animation: float1 20s ease-in-out infinite;
}
.glow-2 {
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(80,120,180,0.15), transparent 70%);
  bottom: -250px; right: -200px;
  animation: float2 25s ease-in-out infinite;
}
.glow-3 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(150,100,180,0.08), transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: float3 30s ease-in-out infinite;
}
@keyframes float1 {
  0%, 100% { transform: translate(0,0); }
  50% { transform: translate(100px, 80px); }
}
@keyframes float2 {
  0%, 100% { transform: translate(0,0); }
  50% { transform: translate(-120px, -100px); }
}
@keyframes float3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
}
/* 榧犳爣鍏夌幆 */
.cursor-glow {
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--main-glow), transparent 60%);
  pointer-events: none;
  z-index: 0;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s;
}
/* 瀹瑰櫒 */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 24px;
  position: relative;
  z-index: 1;
}
/* 鍝佺墝鏍囪瘑 */
.brand {
  text-align: center;
  margin-bottom: 30px;
  color: var(--main);
  font-size: 0.85rem;
  letter-spacing: 0.6em;
  text-transform: uppercase;
  opacity: 0.6;
  font-weight: 300;
}
/* Hero鍖哄煙 */
.hero {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  perspective: 1000px;
}
.hero h1 {
  font-size: clamp(3.5rem, 12vw, 7rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  margin-bottom: 24px;

  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px var(--main-glow));
}
.hero .slogan {

  color: var(--text-dim);

  letter-spacing: 0.1em;
}
.hero .sub {

  color: var(--text-dim);
  opacity: 0.5;
  margin-bottom: 60px;
  letter-spacing: 0.2em;
}
/* 婊氬姩鎻愮ず */
.scroll-hint {

  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--text-dim);
  font-size: 0.8rem;
  opacity: 0.4;
  animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(10px); }
}
/* 鍗＄墖缃戞牸 */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 28px;
  margin: 80px 0;
}
/* 鍏冭壓鏈崱鐗?*/
.card {
  background: var(--card-bg);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px 32px;
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  transform-style: preserve-3d;
  transition: all 0.5s cubic-bezier(0.2,0.8,0.2,1);
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  display: block;
  position: relative;
  overflow: hidden;
}
/* 鍗＄墖椤堕儴鍙戝厜绾?*/
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--main), transparent);
  opacity: 0;
  transition: opacity 0.5s;
}
/* 鍗＄墖鍐呴儴鍏夋檿 */
.card::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  background: radial-gradient(circle, var(--main-glow), transparent 70%);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
  pointer-events: none;
  z-index: -1;
}
.card:hover::before { opacity: 1; }
.card:hover::after { width: 300px; height: 300px; }
.card:hover {
  box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 60px var(--main-glow);
  border-color: rgba(104,159,137,0.4);
  transform: translateY(-12px);
}
.card-icon {
  font-size: 3rem;
  margin-bottom: 20px;
  transform: translateZ(30px);
}
.card h3 {
  font-size: 1.4rem;
  margin-bottom: 12px;

  letter-spacing: 0.08em;
  font-weight: 600;
}
.card p {

  font-size: 0.92rem;
  margin-bottom: 16px;
}
.card .tag {

  background: rgba(104,159,137,0.1);
  border: 1px solid rgba(104,159,137,0.2);
  border-radius: 100px;
  font-size: 0.75rem;
  color: var(--main);
  letter-spacing: 0.1em;
}
/* 閫愬瓧鍔ㄧ敾 */
.char {
  display: inline-block;
  opacity: 0;
  transform: translateY(40px) rotateX(90deg);
  transition: opacity 0.5s, transform 0.5s;
}
.char.visible {
  opacity: 1;
  transform: translateY(0) rotateX(0);
}
/* 婊氬姩娓愬叆 */
.fade-in {
  opacity: 0;
  transform: translateY(60px);
  transition: opacity 0.8s, transform 0.8s;
}
.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}
/* 椤佃剼 */
.footer {
  text-align: center;
  padding: 60px 0 40px;
  color: var(--text-dim);
  font-size: 0.85rem;
  opacity: 0.4;
  letter-spacing: 0.1em;
}
.footer .line {
  width: 60px;
  height: 1px;
  background: var(--main);
  margin: 0 auto 20px;
  opacity: 0.5;
}
@media (max-width: 768px) {
  .cards { grid-template-columns: 1fr; gap: 20px; }
  .hero h1 { font-size: 3rem; }
}
</style>
</head>

<script>
// 绮掑瓙鑳屾櫙 - 甯﹁繛绾挎晥鏋?const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let mouseX = 0, mouseY = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 鍒涘缓绮掑瓙
const particleCount = 100;
for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4,
    opacity: Math.random() * 0.6 + 0.15
  });
}

// 榧犳爣浣嶇疆
document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursorGlow.style.left = e.clientX + 'px';
  cursorGlow.style.top = e.clientY + 'px';
});

// 鍔ㄧ敾寰幆
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 鏇存柊绮掑瓙浣嶇疆
  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;
    if (p.x < 0 || p.x > canvas.width) p.dx = -p.dx;
    if (p.y < 0 || p.y > canvas.height) p.dy = -p.dy;
  });

  // 鐢昏繛绾?  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = 'rgba(104, 159, 137,' + (0.15 * (1 - dist / 120)) + ')';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // 鐢荤矑瀛?  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(104, 159, 137,' + p.opacity + ')';
    ctx.fill();
  });

  requestAnimationFrame(animate);
}
animate();

// 鏍囬閫愬瓧鍔ㄧ敾
const titleText = '澶ч亾鍏冪伒';
const titleEl = document.getElementById('mainTitle');
titleText.split('').forEach((ch, i) => {
  const span = document.createElement('span');
  span.className = 'char';
  span.textContent = ch;
  span.style.transitionDelay = (i * 0.15) + 's';
  titleEl.appendChild(span);
  setTimeout(() => span.classList.add('visible'), 400);
});

// 鍗＄墖3D鍊炬枩
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const rx = ((y - cy) / cy) * -10;
    const ry = ((x - cx) / cx) * 10;
    card.style.transform = perspective(800px) rotateX(deg) rotateY(deg) translateY(-12px);
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateY(0)';
  });
});

// 婊氬姩娓愬叆
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.15 });
document.querySelectorAll('.fade-in').forEach((el, i) => {
  el.style.transitionDelay = (i * 0.12) + 's';
  observer.observe(el);
});

// 婊氬姩瑙嗗樊 - 鑳屾櫙鍏夋枒璺熼殢
let lastScroll = 0;

});
</script>

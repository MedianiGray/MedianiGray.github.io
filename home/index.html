<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观照之境</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/site-config.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  margin: 0; 
  overflow: hidden; 
  background: #050807;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
}
#canvas-container { width: 100vw; height: 100vh; }

.ui-overlay {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 24px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  pointer-events: none;
}
.ui-overlay > * { pointer-events: auto; }
.logo {
  font-size: 1.3rem;
  background: linear-gradient(135deg, #fff, #689F89);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  letter-spacing: 0.1em;
}
.back-link {
  color: #7a8595;
  text-decoration: none;
  font-size: 0.9rem;
  padding: 8px 20px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  transition: all 0.3s;
}
.back-link:hover {
  color: #689F89;
  border-color: #689F89;
  background: rgba(104,159,137,0.1);
}

.hint {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  color: #7a8595;
  font-size: 0.85rem;
  padding: 12px 28px;
  background: rgba(5,8,7,0.7);
  backdrop-filter: blur(20px);
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.08);
  z-index: 100;
  animation: fadeUp 1s ease-out 1.5s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.loading {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #689F89;
  font-size: 1rem;
  letter-spacing: 0.2em;
  z-index: 200;
}
</style>
</head>
<body>

<div class="ui-overlay">
  <div class="logo">🌌 观照之境</div>
  <a href="/" class="back-link">返回 ←</a>
</div>

<div class="hint">🖱️ 拖动旋转 · 滚轮缩放 · 点击光门进入</div>
<div class="loading" id="loading">正在构建空间...</div>

<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const container = document.getElementById('canvas-container');
const loadingEl = document.getElementById('loading');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050807, 0.03);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.8, 0.4, 0.85
);
composer.addPass(bloomPass);

scene.add(new THREE.AmbientLight(0x404040, 0.3));

const mainLight = new THREE.DirectionalLight(0x689F89, 1.5);
mainLight.position.set(3, 8, 3);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
scene.add(mainLight);

const light1 = new THREE.PointLight(0x689F89, 2, 8);
light1.position.set(-2, 2, -1);
scene.add(light1);
const light2 = new THREE.PointLight(0x6496c8, 1.5, 8);
light2.position.set(2, 2, -1);
scene.add(light2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x152018, roughness: 0.7, metalness: 0.3 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(30, 30, 0x2a4a3a, 0x1a2a24);
grid.position.y = 0.01;
scene.add(grid);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a2a24, roughness: 0.9 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
backWall.position.set(0, 2.5, -6);
backWall.receiveShadow = true;
scene.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
leftWall.position.set(-6, 2.5, 0);
leftWall.rotation.y = Math.PI / 2;
leftWall.receiveShadow = true;
scene.add(leftWall);
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
rightWall.position.set(6, 2.5, 0);
rightWall.rotation.y = -Math.PI / 2;
rightWall.receiveShadow = true;
scene.add(rightWall);

function makeTextSprite(text, subtext, color, scale = 1) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 48 * scale;
  const subSize = 24 * scale;
  
  ctx.font = `bold ${fontSize}px 'PingFang SC', sans-serif`;
  const textWidth = ctx.measureText(text).width;
  canvas.width = Math.max(200, textWidth + 80);
  canvas.height = 100 * scale;
  
  ctx.font = `bold ${fontSize}px 'PingFang SC', sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width/2, 40 * scale);
  
  if (subtext) {
    ctx.font = `${subSize}px 'PingFang SC', sans-serif`;
    ctx.fillStyle = '#9ba3b4';
    ctx.fillText(subtext, canvas.width/2, 80 * scale);
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ 
    map: texture, 
    transparent: true,
    depthTest: false,
  });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(canvas.width / 100, canvas.height / 100, 1);
  return sprite;
}

// 核心主入口：观照书写（博客） - 最大最亮
const mainDoor = {
  name: '观照书写',
  sub: '进入文字世界',
  x: 0,
  z: -6.01,
  url: '/',
  color: '#689F89',
  scale: 1.5
};

const secondaryDoors = [
  { name: '器用之辨', sub: '实用工具', x: -3.5, z: -6.01, url: '/tools/', color: '#6496c8', scale: 0.8 },
  { name: '同频相聚', sub: '社群联结', x: 3.5, z: -6.01, url: '/community/', color: '#9a689f', scale: 0.8 },
  { name: '虚拟场域', sub: '空间探索', x: -6.01, z: 0, url: '/space/', rotY: Math.PI/2, color: '#689F89', scale: 0.8 },
  { name: '知识求索', sub: '思想体系', x: 6.01, z: 0, url: '/knowledge/', rotY: -Math.PI/2, color: '#9a8f68', scale: 0.8 },
  { name: '向内觉察', sub: '关于我', x: 0, z: 6.01, url: '/about/', rotY: Math.PI, color: '#689F89', scale: 0.8 },
];

const allDoors = [mainDoor, ...secondaryDoors];
const doorMeshes = [];

allDoors.forEach((door) => {
  const doorGroup = new THREE.Group();
  const doorColor = new THREE.Color(door.color);
  const s = door.scale || 1;
  
  const doorMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4 * s, 2.4 * s),
    new THREE.MeshStandardMaterial({ 
      color: doorColor,
      emissive: doorColor,
      emissiveIntensity: 0.6,
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide,
    })
  );
  doorGroup.add(doorMesh);
  
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(1.5 * s, 2.5 * s, 0.05),
    new THREE.MeshStandardMaterial({ 
      color: doorColor,
      emissive: doorColor,
      emissiveIntensity: 1.5,
      transparent: true,
      opacity: 0.8,
    })
  );
  frame.position.z = -0.02;
  doorGroup.add(frame);
  
  const label = makeTextSprite(door.name, door.sub, door.color, s);
  label.position.set(0, 1.8 * s, 0.1);
  doorGroup.add(label);
  
  const doorLight = new THREE.PointLight(doorColor, 1 * s, 4 * s);
  doorLight.position.z = 0.5;
  doorGroup.add(doorLight);
  
  doorGroup.position.set(door.x, 1.2 * s, door.z);
  if (door.rotY) doorGroup.rotation.y = door.rotY;
  
  doorGroup.userData = { ...door };
  scene.add(doorGroup);
  doorMeshes.push(doorGroup);
});

const dustCount = 500;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount * 3; i++) {
  dustPos[i] = (Math.random() - 0.5) * 20;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size: 0.02,
  color: 0x8ab8a5,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
}));
scene.add(dust);

let isDragging = false;
let prevX = 0, prevY = 0;
let camAngle = 0;
let camHeight = 1.7;
let camDist = 6;
let autoRotate = true;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  autoRotate = false;
  prevX = e.clientX;
  prevY = e.clientY;
});

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  
  if (isDragging) {
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    camAngle -= dx * 0.005;
    camHeight = Math.max(1.2, Math.min(2.5, camHeight + dy * 0.003));
    prevX = e.clientX;
    prevY = e.clientY;
  }
});

renderer.domElement.addEventListener('mouseup', () => isDragging = false);

renderer.domElement.addEventListener('click', (e) => {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(doorMeshes, true);
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && !obj.userData.name) obj = obj.parent;
    if (obj.userData.url) window.location.href = obj.userData.url;
  }
});

renderer.domElement.addEventListener('wheel', (e) => {
  camDist = Math.max(3.5, Math.min(10, camDist + e.deltaY * 0.01));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  
  if (autoRotate) camAngle += 0.001;
  
  camera.position.x = Math.sin(camAngle) * camDist;
  camera.position.z = Math.cos(camAngle) * camDist;
  camera.position.y = camHeight + Math.sin(time * 0.5) * 0.05;
  camera.lookAt(0, 1.5, 0);
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(doorMeshes, true);
  doorMeshes.forEach(door => {
    let hovered = false;
    intersects.forEach(i => {
      let obj = i.object;
      while (obj) { if (obj === door) hovered = true; obj = obj.parent; }
    });
    if (hovered) {
      door.children[0].material.emissiveIntensity = 1.2;
      door.children[1].material.emissiveIntensity = 2.5;
      door.scale.set(1.08, 1.08, 1.08);
      document.body.style.cursor = 'pointer';
    } else {
      door.children[0].material.emissiveIntensity = 0.6 + Math.sin(time * 2) * 0.1;
      door.children[1].material.emissiveIntensity = 1.5;
      door.scale.set(1, 1, 1);
      document.body.style.cursor = isDragging ? 'grabbing' : 'grab';
    }
  });
  
  const positions = dust.geometry.attributes.position.array;
  for (let i = 1; i < dustCount * 3; i += 3) {
    positions[i] += 0.001;
    if (positions[i] > 5) positions[i] = 0;
  }
  dust.geometry.attributes.position.needsUpdate = true;
  dust.rotation.y = time * 0.02;
  
  light1.intensity = 1.5 + Math.sin(time * 1.5) * 0.3;
  light2.intensity = 1.2 + Math.cos(time * 1.2) * 0.2;
  
  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

loadingEl.style.display = 'none';
animate();
</script>

</body>
</html>

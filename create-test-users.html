<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建测试账号</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #161d1b;
  color: #e8edf2;
  padding: 40px;
  max-width: 600px;
  margin: 0 auto;
}
h1 { color: #689F89; }
.log {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
  font-family: monospace;
  font-size: 0.9rem;
  line-height: 1.8;
}
.success { color: #689F89; }
.error { color: #e06c6c; }
.info { color: #9ba3b4; }
</style>
</head>
<body>
<h1>🔧 自动创建测试账号</h1>
<div class="log" id="log">正在初始化...</div>

<script>
const SUPABASE_URL = "https://xyxrwstdhmauwrbrojnr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const logEl = document.getElementById('log');
function log(msg, type = 'info') {
    logEl.innerHTML += `<div class="${type}">${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}

// 三个简单测试账号
const testUsers = [
    { email: 'user@test.com', password: '123456', role: 'user', username: '普通用户' },
    { email: 'admin@test.com', password: '123456', role: 'admin', username: '管理员' },
    { email: 'super@test.com', password: '123456', role: 'super_admin', username: '超级管理员' }
];

async function createTestUsers() {
    log('🚀 开始创建测试账号...', 'info');
    log('---', 'info');
    
    // 先测试一下Supabase连接
    log('🔍 测试Supabase连接...', 'info');
    try {
        const { data, error } = await sb.from('profiles').select('count');
        if (error) {
            log(`❌ 连接失败: ${error.message}`, 'error');
            log('💡 请检查：1. Email Provider是否开启 2. CORS配置 3. 网络是否正常', 'info');
            return;
        }
        log('✅ Supabase连接正常', 'success');
    } catch(e) {
        log(`❌ 连接错误: ${e.message}`, 'error');
        return;
    }
    log('---', 'info');
    
    for (const user of testUsers) {
        try {
            log(`📧 正在创建 ${user.username}...`, 'info');
            
            // 注册
            const { data, error: signUpError } = await sb.auth.signUp({
                email: user.email,
                password: user.password
            });
            
            if (signUpError) {
                log(`❌ 注册失败: ${signUpError.message}`, 'error');
                log(`   错误码: ${signUpError.status || 'unknown'}`, 'error');
                continue;
            }
            
            if (!data.user) {
                log(`❌ 注册成功但没返回用户数据`, 'error');
                continue;
            }
            
            log(`✅ 注册成功: ${user.email}`, 'success');
            
            // 创建profiles记录
            const { error: profileError } = await sb.from('profiles').upsert({
                id: data.user.id,
                username: user.username,
                role: user.role
            });
            
            if (profileError) {
                log(`⚠️  profiles写入失败: ${profileError.message}`, 'error');
            } else {
                log(`✅ 资料已写入: ${user.role}`, 'success');
            }
            
            log('---', 'info');
            
            // 退出登录，准备下一个
            await sb.auth.signOut();
        } catch(e) {
            log(`❌ 出错: ${e.message}`, 'error');
            log(`   类型: ${e.constructor.name}`, 'error');
        }
    }
    
    log('🎉 全部完成！', 'success');
    log('---', 'info');
    log('📋 测试账号:', 'info');
    log('👤 普通用户: user@test.com / 123456', 'info');
    log('⚙️ 管理员: admin@test.com / 123456', 'info');
    log('👑 超级管理员: super@test.com / 123456', 'info');
}

createTestUsers();
</script>
</body>
</html>

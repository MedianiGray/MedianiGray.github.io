<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同频相聚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-glow: rgba(104,159,137,0.2);
  --bg: #0a0f0e;
  --bg-secondary: #121a18;
  --bg-card: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --text: #e8edf2;
  --text-dim: #7a8595;
  --border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  min-height: 100vh;
}
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,15,14,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
}
.nav-left { display: flex; align-items: center; gap: 20px; }
.back-btn {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.back-btn:hover { color: var(--text); border-color: var(--main); }
.nav-title { font-size: 1.1rem; font-weight: 600; }
.nav-right { display: flex; gap: 10px; }
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.btn:hover { background: var(--bg-hover); }
.btn-primary {
  background: var(--main);
  border-color: var(--main);
  color: white;
}
.btn-primary:hover { opacity: 0.9; }
.main-layout {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  gap: 20px;
  padding: 80px 24px 24px;
  max-width: 1400px;
  margin: 0 auto;
}
.sidebar-left, .sidebar-right {
  position: sticky;
  top: 80px;
  height: fit-content;
}
.sidebar-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.sidebar-section h3 {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-bottom: 12px;
  font-weight: 500;
}
.nav-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 4px;
  font-size: 0.9rem;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { background: var(--main-glow); color: var(--main); }
.feed-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.tabs { display: flex; gap: 4px; }
.tab {
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text-dim);
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg-card); color: var(--text); }
.composer {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
}
.composer textarea {
  width: 100%;
  min-height: 80px;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 0.95rem;
  resize: none;
  outline: none;
  font-family: inherit;
}
.composer-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.mood-selector { display: flex; gap: 8px; }
.mood {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 1.1rem;
}
.mood:hover { background: var(--bg-hover); }
.mood.active { background: var(--main-glow); }
.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  transition: all 0.2s;
}
.post-card:hover { background: var(--bg-hover); }
.post-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--main);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  flex-shrink: 0;
}
.post-user { flex: 1; }
.post-username { font-weight: 600; font-size: 0.95rem; }
.post-time { font-size: 0.8rem; color: var(--text-dim); }
.post-mood { font-size: 1.2rem; }
.post-content {
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 12px;
}
.post-actions {
  display: flex;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.9rem;
  transition: color 0.2s;
}
.action-btn:hover { color: var(--text); }
.action-btn.liked { color: #e74c3c; }
.stats-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.stats-card h3 {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-bottom: 12px;
  font-weight: 500;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.9rem;
}
.stat-row span:first-child { color: var(--text-dim); }
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  transition: transform 0.3s;
  z-index: 1000;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.comments-section {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid var(--border);
  display: none;
}
.comments-section.show { display: block; }
.comment-list { margin-bottom: 15px; }
.comment-item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.comment-item:last-child { border-bottom: none; }
.comment-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--main);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.comment-content { flex: 1; }
.comment-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.comment-username {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text);
}
.comment-time {
  font-size: 0.75rem;
  color: var(--text-dim);
}
.comment-text {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.5;
}
.comment-input-area {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.comment-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}
.comment-input:focus { border-color: var(--main); }
.comment-submit {
  background: var(--main);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: opacity 0.2s;
}
.comment-submit:hover { opacity: 0.9; }
@media (max-width: 1024px) {
  .main-layout { grid-template-columns: 1fr; }
  .sidebar-left, .sidebar-right { display: none; }
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<nav class="top-nav">
  <div class="nav-left">
    <a href="/home/" class="back-btn">← 返回门廊</a>
    <div class="nav-title">同频相聚</div>
  </div>
  <div class="nav-right">
    <button class="btn" onclick="window.location.href='/admin/login.html?redirect=' + encodeURIComponent(window.location.pathname)">登录</button>
    <button class="btn btn-primary" onclick="document.querySelector('.composer textarea').focus()">发帖</button>
  </div>
</nav>
<div class="main-layout">
  <aside class="sidebar-left">
    <div class="sidebar-section">
      <h3>导航</h3>
      <div class="nav-item active" onclick="switchNav(this, '最新')">🌊 最新</div>
      <div class="nav-item" onclick="switchNav(this, '热门')">🔥 热门</div>
      <div class="nav-item" onclick="switchNav(this, '我的回复')">💬 我的回复</div>
      <div class="nav-item" onclick="switchNav(this, '我收藏的')">⭐ 我收藏的</div>
    </div>
    <div class="sidebar-section">
      <h3>心情频道</h3>
      <div class="nav-item" onclick="switchMoodFilter(this, '平静')">😌 平静</div>
      <div class="nav-item" onclick="switchMoodFilter(this, '思考')">🤔 思考</div>
      <div class="nav-item" onclick="switchMoodFilter(this, '灵感')">✨ 灵感</div>
      <div class="nav-item" onclick="switchMoodFilter(this, '感慨')">💭 感慨</div>
    </div>
  </aside>
  <main class="feed">
    <div class="feed-header">
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this, '最新')">最新</div>
        <div class="tab" onclick="switchTab(this, '热门')">热门</div>
        <div class="tab" onclick="switchTab(this, '关注')">关注</div>
      </div>
    </div>
    <div class="composer">
      <textarea id="postInput" placeholder="分享此刻的感受..."></textarea>
      <div class="composer-footer">
        <div class="mood-selector">
          <div class="mood active" onclick="selectMood(this)">😌</div>
          <div class="mood" onclick="selectMood(this)">🤔</div>
          <div class="mood" onclick="selectMood(this)">✨</div>
          <div class="mood" onclick="selectMood(this)">💭</div>
        </div>
        <button class="btn btn-primary" onclick="publishPost()">发布</button>
      </div>
    </div>
    <div id="postsList">
      <div style="text-align:center;padding:40px;color:var(--text-dim);">加载中...</div>
    </div>
  </main>
  <aside class="sidebar-right">
    <div class="stats-card">
      <h3>今日数据</h3>
      <div class="stat-row">
        <span>在线人数</span>
        <span>12</span>
      </div>
      <div class="stat-row">
        <span>今日帖子</span>
        <span>8</span>
      </div>
      <div class="stat-row">
        <span>总点赞</span>
        <span>1,247</span>
      </div>
    </div>
    <div class="stats-card">
      <h3>活跃话题</h3>
      <div class="stat-row">
        <span>#观照书写</span>
        <span>32</span>
      </div>
      <div class="stat-row">
        <span>#有无相生</span>
        <span>18</span>
      </div>
      <div class="stat-row">
        <span>#器用之辨</span>
        <span>12</span>
      </div>
    </div>
  </aside>
</div>
<script>
const supabaseUrl = 'https://xyxrwstdhmauwrbrojnr.supabase.co';
const supabaseKey = 'sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG';
const sb = supabase.createClient(supabaseUrl, supabaseKey);
let selectedMood = '😌';
let currentUser = null;
let posts = [];
async function init() {
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  if (!currentUser) {
    showToast('请先登录，3秒后跳转登录页...');
    setTimeout(() => window.location.href = '/admin/login.html?redirect=' + encodeURIComponent(window.location.pathname), 3000);
    return;
  }
  await loadPosts();
}
async function loadPosts() {
  const postsList = document.getElementById('postsList');
  postsList.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">加载中...</div>';
  try {
    const { data, error } = await sb
      .from('community_posts')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) throw error;
    posts = data || [];
    renderPosts();
  } catch (e) {
    console.error('加载帖子失败:', e);
    postsList.innerHTML = getSamplePosts();
    showToast('使用示例数据（数据库未连接）');
  }
}
function renderPosts() {
  const postsList = document.getElementById('postsList');
  if (posts.length === 0) {
    postsList.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">还没有帖子，来发布第一条吧</div>';
    return;
  }
  postsList.innerHTML = posts.map(post => {
    const username = '匿名用户';
    const avatarChar = username.charAt(0).toUpperCase();
    const timeAgo = formatTime(post.created_at);
    const likes = post.likes || 0;
    const comments = post.comments || 0;
    return `
      <div class="post-card" data-id="${post.id}">
        <div class="post-header">
          <div class="avatar">${avatarChar}</div>
          <div class="post-user">
            <div class="post-username">${escapeHtml(username)}</div>
            <div class="post-time">${timeAgo}</div>
          </div>
          <div class="post-mood">${post.mood || '😌'}</div>
        </div>
        <div class="post-content">${escapeHtml(post.content || '')}</div>
        <div class="post-actions">
          <div class="action-btn" onclick="toggleLike(this, '${post.id}')">❤️ <span>${likes}</span></div>
          <div class="action-btn" onclick="toggleComments(this, '${post.id}')">💬 <span>${comments}</span></div>
          <div class="action-btn" onclick="toggleFav(this)">⭐ 收藏</div>
        </div>
        <div class="comments-section" id="comments-${post.id}">
          <div class="comment-list" id="commentList-${post.id}">
            <div style="text-align:center;padding:10px;color:var(--text-dim);font-size:0.85rem;">暂无评论</div>
          </div>
          <div class="comment-input-area">
            <input type="text" class="comment-input" id="commentInput-${post.id}" placeholder="写下你的评论..." />
            <button class="comment-submit" onclick="submitComment('${post.id}')">发送</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
async function publishPost() {
  const input = document.getElementById('postInput');
  const content = input.value.trim();
  if (!content) { showToast('请输入内容'); return; }
  if (!currentUser) {
    showToast('请先登录，3秒后跳转登录页...');
    setTimeout(() => window.location.href = '/admin/login.html?redirect=' + encodeURIComponent(window.location.pathname), 3000);
    return;
  }
  try {
    const { data, error } = await sb
      .from('community_posts')
      .insert({ user_id: currentUser.id, content: content, mood: selectedMood, likes: 0, comments: 0 })
      .select();
    if (error) throw error;
    input.value = '';
    showToast('发布成功');
    await loadPosts();
  } catch (e) {
    console.error('发布失败:', e);
    showToast('发布失败：' + e.message);
  }
}
async function toggleLike(btn, postId) {
  btn.classList.toggle('liked');
  const span = btn.querySelector('span');
  span.textContent = parseInt(span.textContent) + (btn.classList.contains('liked') ? 1 : -1);
}
function toggleFav(btn) {
  btn.classList.toggle('liked');
  if (btn.classList.contains('liked')) { btn.innerHTML = '⭐ 已收藏'; } else { btn.innerHTML = '⭐ 收藏'; }
}
function toggleComments(btn, postId) {
  const section = document.getElementById('comments-' + postId);
  if (section.classList.contains('show')) {
    section.classList.remove('show');
  } else {
    section.classList.add('show');
    loadComments(postId);
  }
}
async function loadComments(postId) {
  const listEl = document.getElementById('commentList-' + postId);
  listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-dim);font-size:0.85rem;">加载中...</div>';
  try {
    const { data, error } = await sb
      .from('community_replies')
      .select('*')
      .eq('post_id', postId)
      .order('created_at', { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-dim);font-size:0.85rem;">暂无评论</div>';
      return;
    }
    listEl.innerHTML = data.map(comment => {
      const username = '匿名用户';
      const avatarChar = username.charAt(0).toUpperCase();
      const timeAgo = formatTime(comment.created_at);
      return `
        <div class="comment-item">
          <div class="comment-avatar">${avatarChar}</div>
          <div class="comment-content">
            <div class="comment-header">
              <span class="comment-username">${escapeHtml(username)}</span>
              <span class="comment-time">${timeAgo}</span>
            </div>
            <div class="comment-text">${escapeHtml(comment.content || '')}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error('加载评论失败:', e);
    listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-dim);font-size:0.85rem;">加载失败</div>';
  }
}
async function submitComment(postId) {
  const input = document.getElementById('commentInput-' + postId);
  const content = input.value.trim();
  if (!content) { showToast('请输入评论内容'); return; }
  if (!currentUser) { showToast('请先登录'); return; }
  try {
    const { data, error } = await sb
      .from('community_replies')
      .insert({ post_id: postId, user_id: currentUser.id, content: content, likes: 0 })
      .select();
    if (error) throw error;
    input.value = '';
    showToast('评论发布成功');
    await loadComments(postId);
  } catch (e) {
    console.error('评论失败:', e);
    showToast('评论失败：' + e.message);
  }
}
function formatTime(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  return days + '天前';
}
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function getSamplePosts() {
  return `
    <div class="post-card">
      <div class="post-header">
        <div class="avatar">林</div>
        <div class="post-user">
          <div class="post-username">林晓风</div>
          <div class="post-time">2小时前</div>
        </div>
        <div class="post-mood">✨</div>
      </div>
      <div class="post-content">今天傍晚的风很温柔，坐在窗边看了很久的云。突然觉得，所谓的"道"，也许就是这种不需要用力的状态。</div>
      <div class="post-actions">
        <div class="action-btn" onclick="toggleLike(this)">❤️ <span>24</span></div>
        <div class="action-btn" onclick="toggleComments(this, 'sample-1')">💬 <span>8</span></div>
        <div class="action-btn" onclick="toggleFav(this)">⭐ 收藏</div>
      </div>
        <div class="comments-section" id="comments-sample-1">
          <div class="comment-list" id="commentList-sample-1">
            <div style="text-align:center;padding:10px;color:var(--text-dim);font-size:0.85rem;">暂无评论</div>
          </div>
          <div class="comment-input-area">
            <input type="text" class="comment-input" id="commentInput-sample-1" placeholder="写下你的评论..." />
            <button class="comment-submit" onclick="submitComment('sample-1')">发送</button>
          </div>
        </div>
    </div>
  `;
}
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
function switchTab(el, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  showToast('切换到：' + name);
}
function switchNav(el, name) {
  el.parentElement.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  showToast('切换到：' + name);
}
function selectMood(el) {
  document.querySelectorAll('.mood').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
  selectedMood = el.textContent;
}
function switchMoodFilter(el, mood) {
  showToast('筛选心情：' + mood);
}
window.addEventListener('load', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元社区 · 大道元灵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-deep: #4E7A68;
  --main-glow: rgba(104,159,137,0.3);
  --bg: #0a0f0e;
  --bg-card: #161d1b;
  --text: #e8edf2;
  --text-dim: #7a8595;
  --glass: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', 'Georgia', serif;
  line-height: 1.7;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px;
}
.back-link {
  display: inline-block;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.9rem;
  margin-bottom: 30px;
}
.back-link:hover { color: var(--main); }
.page-title {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #fff, var(--main));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-subtitle {
  color: var(--text-dim);
  margin-bottom: 40px;
}

/* 统计 */
.stats-row {
  display: flex;
  gap: 30px;
  margin-bottom: 30px;
  padding: 20px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
}
.stat-item {
  flex: 1;
  text-align: center;
}
.stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--main);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* 发布区 */
.post-composer {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 30px;
}
.post-composer textarea {
  width: 100%;
  min-height: 100px;
  padding: 15px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-size: 0.95rem;
  resize: vertical;
  font-family: inherit;
}
.post-composer textarea:focus {
  outline: none;
  border-color: var(--main);
}
.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
  flex-wrap: wrap;
  gap: 10px;
}
.mood-selector {
  display: flex;
  gap: 8px;
}
.mood-btn {
  font-size: 1.5rem;
  cursor: pointer;
  padding: 5px;
  border-radius: 8px;
  transition: all 0.2s;
  opacity: 0.5;
}
.mood-btn.active, .mood-btn:hover {
  opacity: 1;
  background: var(--glass);
}
.anon-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-dim);
  cursor: pointer;
}
.publish-btn {
  padding: 10px 24px;
  background: var(--main);
  color: white;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.publish-btn:hover {
  background: var(--main-deep);
}

/* 排序切换 */
.sort-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.sort-tab {
  padding: 8px 20px;
  border-radius: 100px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.9rem;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.sort-tab.active {
  background: var(--main-glow);
  color: var(--main);
  border-color: var(--main);
}

/* 帖子列表 */
.post-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.post-item {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px;
}
.post-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.post-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--main), var(--main-glow));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: white;
}
.post-author {
  font-weight: 600;
}
.post-time {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-left: auto;
}
.post-content {
  margin-bottom: 15px;
  line-height: 1.8;
}
.post-mood {
  font-size: 1.2rem;
}
.post-actions {
  display: flex;
  gap: 20px;
  padding-top: 15px;
  border-top: 1px solid var(--glass-border);
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.action-btn:hover {
  color: var(--main);
}
.action-btn.liked {
  color: var(--main);
}

/* 热榜 */
.hot-section {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px;
  margin-top: 30px;
}
.hot-title {
  font-size: 1.1rem;
  color: var(--main);
  margin-bottom: 15px;
}
.hot-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--glass-border);
}
.hot-rank {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--main-glow);
  color: var(--main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
}
.hot-content {
  flex: 1;
  font-size: 0.9rem;
}
.hot-likes {
  font-size: 0.8rem;
  color: var(--text-dim);
}

@media (max-width: 600px) {
  .container { padding: 20px 15px; }
  .page-title { font-size: 1.8rem; }
  .stats-row { flex-wrap: wrap; }
  .post-actions { gap: 15px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/home/" class="back-link">← 返回元门户</a>
  
  <h1 class="page-title">元社区</h1>
  <p class="page-subtitle">与同频者相聚 · 在交流中彼此映照，共同生长</p>

  <!-- 统计 -->
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-num" id="statPosts">0</div>
      <div class="stat-label">帖子</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statComments">0</div>
      <div class="stat-label">评论</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statLikes">0</div>
      <div class="stat-label">点赞</div>
    </div>
  </div>

  <!-- 发布区 -->
  <div class="post-composer">
    <textarea id="postInput" placeholder="说点什么..."></textarea>
    <div class="composer-actions">
      <div class="mood-selector">
        <span class="mood-btn" data-mood="😊">😊</span>
        <span class="mood-btn" data-mood="😢">😢</span>
        <span class="mood-btn" data-mood="😡">😡</span>
        <span class="mood-btn" data-mood="😰">😰</span>
        <span class="mood-btn" data-mood="😔">😔</span>
      </div>
      <label class="anon-toggle">
        <input type="checkbox" id="anonToggle">
        匿名发布
      </label>
      <button class="publish-btn" onclick="submitPost()">发布</button>
    </div>
  </div>

  <!-- 排序切换 -->
  <div class="sort-tabs">
    <div class="sort-tab active" data-sort="latest">最新</div>
    <div class="sort-tab" data-sort="hot">最热</div>
  </div>

  <!-- 帖子列表 -->
  <div class="post-list" id="postList">
    <p style="color:var(--text-dim);text-align:center;padding:40px;">加载中...</p>
  </div>

  <!-- 热榜 -->
  <div class="hot-section">
    <h3 class="hot-title">🔥 今日热榜</h3>
    <div id="hotList">
      <p style="color:var(--text-dim);">加载中...</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nxrinxhhuhtexfzkwxbu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VyMh9BT9Tzm6uhM-Mkj5UA_WHm6ITiW";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentMood = '😊';
let currentSort = 'latest';

// 心情选择
document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMood = btn.dataset.mood;
    });
});

// 排序切换
document.querySelectorAll('.sort-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSort = tab.dataset.sort;
        loadPosts();
    });
});

async function loadStats() {
    try {
        const { count: postCount } = await sb.from('community_posts').select('*', { count: 'exact', head: true });
        document.getElementById('statPosts').textContent = postCount || 0;
    } catch(e) {
        console.log('统计加载失败:', e);
    }
}

async function loadPosts() {
    const listEl = document.getElementById('postList');
    listEl.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px;">加载中...</p>';
    
    try {
        let query = sb.from('community_posts').select('*');
        if (currentSort === 'latest') {
            query = query.order('created_at', { ascending: false });
        } else {
            query = query.order('likes_count', { ascending: false });
        }
        const { data, error } = await query;
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
            listEl.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px;">还没有帖子，来发第一条吧~</p>';
            return;
        }
        
        listEl.innerHTML = data.map(post => `
            <div class="post-item">
                <div class="post-header">
                    <div class="post-avatar">${post.is_anonymous ? '匿' : (post.author_name?.[0] || '访')}</div>
                    <div>
                        <div class="post-author">${post.is_anonymous ? '匿名用户' : (post.author_name || '访客')}</div>
                        <div style="font-size:0.8rem;color:var(--text-dim);">${new Date(post.created_at).toLocaleString('zh-CN')}</div>
                    </div>
                </div>
                <div class="post-content">
                    ${post.mood ? `<span class="post-mood">${post.mood}</span> ` : ''}
                    ${post.content}
                </div>
                <div class="post-actions">
                    <span class="action-btn" onclick="likePost('${post.id}', this)">
                        ❤️ ${post.likes_count || 0}
                    </span>
                    <span class="action-btn">💬 ${post.comments_count || 0}</span>
                    <span class="action-btn">↗️ 分享</span>
                </div>
            </div>
        `).join('');
    } catch(e) {
        listEl.innerHTML = '<p style="color:var(--danger);text-align:center;padding:40px;">加载失败: ' + e.message + '</p>';
    }
}

async function loadHot() {
    const hotEl = document.getElementById('hotList');
    try {
        const { data, error } = await sb
            .from('community_posts')
            .select('*')
            .order('likes_count', { ascending: false })
            .limit(5);
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
            hotEl.innerHTML = '<p style="color:var(--text-dim);">暂无热榜</p>';
            return;
        }
        
        hotEl.innerHTML = data.map((post, i) => `
            <div class="hot-item">
                <div class="hot-rank">${i + 1}</div>
                <div class="hot-content">${post.content.substring(0, 30)}${post.content.length > 30 ? '...' : ''}</div>
                <div class="hot-likes">❤️ ${post.likes_count || 0}</div>
            </div>
        `).join('');
    } catch(e) {
        hotEl.innerHTML = '<p style="color:var(--text-dim);">热榜加载失败</p>';
    }
}

async function submitPost() {
    const input = document.getElementById('postInput');
    const content = input.value.trim();
    const isAnonymous = document.getElementById('anonToggle').checked;
    
    if (!content) return;
    
    try {
        const { error } = await sb
            .from('community_posts')
            .insert([{
                content: content,
                mood: currentMood,
                is_anonymous: isAnonymous,
                author_name: isAnonymous ? null : '访客'
            }]);
        
        if (error) throw error;
        
        input.value = '';
        loadPosts();
        loadStats();
        loadHot();
    } catch(e) {
        alert('发布失败: ' + e.message);
    }
}

async function likePost(postId, btnEl) {
    try {
        await sb.rpc('increment_likes', { post_id: postId });
        btnEl.innerHTML = '❤️ ' + (parseInt(btnEl.textContent.match(/\d+/)[0]) + 1);
    } catch(e) {
        console.log('点赞失败:', e);
        // 简单+1
        const num = parseInt(btnEl.textContent.match(/\d+/)[0]);
        btnEl.innerHTML = '❤️ ' + (num + 1);
    }
}

// 页面加载
window.addEventListener('load', () => {
    loadStats();
    loadPosts();
    loadHot();
});
</script>
</body>
</html>

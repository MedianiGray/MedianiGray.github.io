<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元社区 · 大道元灵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-glow: rgba(104,159,137,0.3);
  --bg: #07090d;
  --text: #e8edf2;
  --text-dim: #7a8595;
  --glass: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --card-bg: rgba(12,16,24,0.6);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', 'Georgia', serif;
  line-height: 1.7;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 60px 24px;
}
.back-link {
  display: inline-block;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.9rem;
  margin-bottom: 30px;
  transition: color 0.3s;
}
.back-link:hover { color: var(--main); }
.page-title {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #fff, var(--main));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-subtitle {
  color: var(--text-dim);
  margin-bottom: 50px;
  font-size: 1rem;
}

/* 社区板块 */
.community-hero {
  background: var(--card-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 40px;
  margin-bottom: 40px;
  backdrop-filter: blur(20px);
  text-align: center;
}
.community-hero h2 {
  font-size: 1.5rem;
  color: var(--main);
  margin-bottom: 10px;
}
.community-hero p {
  color: var(--text-dim);
  font-style: italic;
}

/* 统计 */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 25px;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--main);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* 评论区 */
.comment-section {
  background: var(--card-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 35px;
  margin-bottom: 30px;
  backdrop-filter: blur(20px);
}
.section-title {
  font-size: 1.3rem;
  color: var(--main);
  margin-bottom: 20px;
}
.comment-input {
  width: 100%;
  min-height: 100px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(104,159,137,0.2);
  border-radius: 12px;
  color: var(--text);
  font-size: 0.95rem;
  box-sizing: border-box;
  margin-bottom: 15px;
  resize: vertical;
  font-family: inherit;
}
.comment-input:focus {
  outline: none;
  border-color: var(--main);
}
.comment-btn {
  padding: 10px 28px;
  background: rgba(104,159,137,0.2);
  border: 1px solid rgba(104,159,137,0.4);
  border-radius: 100px;
  color: var(--main);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
}
.comment-btn:hover {
  background: rgba(104,159,137,0.3);
  transform: translateY(-2px);
}

/* 评论列表 */
.comment-list {
  margin-top: 30px;
}
.comment-item {
  padding: 20px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  margin-bottom: 15px;
  border-left: 3px solid rgba(104,159,137,0.3);
}
.comment-meta {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}
.comment-content {
  color: var(--text);
  font-size: 0.95rem;
  line-height: 1.6;
}

/* 社区成员 */
.members-section {
  background: var(--card-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 35px;
  backdrop-filter: blur(20px);
}
.members-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 15px;
  margin-top: 20px;
}
.member-card {
  text-align: center;
  padding: 20px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  transition: all 0.3s;
}
.member-card:hover {
  transform: translateY(-3px);
  background: rgba(104,159,137,0.08);
}
.member-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--main), var(--main-glow));
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: #fff;
  font-weight: 700;
}
.member-name {
  font-size: 0.85rem;
  color: var(--text);
}
.member-role {
  font-size: 0.7rem;
  color: var(--main);
  margin-top: 3px;
}

.footer {
  text-align: center;
  padding: 60px 0 30px;
  color: var(--text-dim);
  font-size: 0.85rem;
  opacity: 0.5;
}
</style>
</head>
<body>
<div class="container">
  <a href="/home/" class="back-link">← 返回元门户</a>
  
  <h1 class="page-title">元社区</h1>
  <p class="page-subtitle">与同频者相聚 · 在交流中彼此映照，共同生长</p>

  <!-- 社区介绍 -->
  <div class="community-hero">
    <h2>🌱 社群联结</h2>
    <p>这里是读者与作者相遇的地方。留下你的想法，我们一起探讨。</p>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num" id="statComments">0</div>
        <div class="stat-label">评论</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statMembers">0</div>
        <div class="stat-label">访客</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statLikes">0</div>
        <div class="stat-label">点赞</div>
      </div>
    </div>
  </div>

  <!-- 评论区 -->
  <div class="comment-section">
    <h2 class="section-title">💬 留言板</h2>
    <textarea class="comment-input" id="commentInput" placeholder="留下你的想法..."></textarea>
    <button class="comment-btn" onclick="submitComment()">发布评论</button>
    
    <div class="comment-list" id="commentList">
      <div class="comment-item" style="opacity:0.5;">
        <div class="comment-meta">
          <span>加载中...</span>
          <span></span>
        </div>
        <div class="comment-content">正在连接数据库...</div>
      </div>
    </div>
  </div>

  <!-- 社区成员 -->
  <div class="members-section">
    <h2 class="section-title">👥 社区成员</h2>
    <div class="members-grid">
      <div class="member-card">
        <div class="member-avatar">M</div>
        <div class="member-name">MedianiGray</div>
        <div class="member-role">站长</div>
      </div>
      <div class="member-card">
        <div class="member-avatar">访</div>
        <div class="member-name">访客</div>
        <div class="member-role">读者</div>
      </div>
      <div class="member-card">
        <div class="member-avatar">新</div>
        <div class="member-name">新朋友</div>
        <div class="member-role">等待加入</div>
      </div>
    </div>
  </div>

  <div class="footer">
    大道元灵 · 元社区 · Est. 2026
  </div>
</div>

<script>
// Supabase配置
const SUPABASE_URL = 'https://xyxrwstdhmauwrbrojnr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Vu7vCurGlKENUEo2i8cl9w_jHo36hjG';
const PAGE_ID = 'community_main';

let supabase = null;
try {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error('Supabase init failed:', e);
}

function getUserId() {
  let id = localStorage.getItem('user_id');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('user_id', id);
  }
  return id;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 加载统计
async function loadStats() {
  if (!supabase) return;
  try {
    const { count: commentCount } = await supabase
      .from('comments')
      .select('*', { count: 'exact', head: true })
      .eq('page_id', PAGE_ID);
    document.getElementById('statComments').textContent = commentCount || 0;

    const { count: likeCount } = await supabase
      .from('likes')
      .select('*', { count: 'exact', head: true })
      .eq('page_id', PAGE_ID);
    document.getElementById('statLikes').textContent = likeCount || 0;
  } catch (e) {
    console.error('加载统计失败:', e);
  }
}

// 加载评论
async function loadComments() {
  if (!supabase) return;
  const listEl = document.getElementById('commentList');
  try {
    const { data, error } = await supabase
      .from('comments')
      .select('*')
      .eq('page_id', PAGE_ID)
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (data && data.length > 0) {
      listEl.innerHTML = data.map(c => `
        <div class="comment-item">
          <div class="comment-meta">
            <span>${c.author_name || '匿名'}</span>
            <span>${new Date(c.created_at).toLocaleString('zh-CN')}</span>
          </div>
          <div class="comment-content">${escapeHtml(c.content)}</div>
        </div>
      `).join('');
    } else {
      listEl.innerHTML = '<div class="comment-item" style="opacity:0.5;"><div class="comment-content">还没有评论，来抢沙发~</div></div>';
    }
  } catch (e) {
    console.error('加载评论失败:', e);
    listEl.innerHTML = '<div class="comment-item" style="opacity:0.5;"><div class="comment-content">评论加载失败，请检查数据库表是否创建</div></div>';
  }
}

// 提交评论
async function submitComment() {
  const input = document.getElementById('commentInput');
  const content = input.value.trim();
  if (!content) return;

  if (!supabase) {
    alert('Supabase未初始化');
    return;
  }

  try {
    const { error } = await supabase
      .from('comments')
      .insert({
        page_id: PAGE_ID,
        content: content,
        author_name: '访客'
      });

    if (error) throw error;

    input.value = '';
    loadComments();
    loadStats();
  } catch (e) {
    console.error('评论提交失败:', e);
    alert('评论提交失败，请检查数据库表是否创建');
  }
}

// 页面加载
window.addEventListener('load', function() {
  loadStats();
  loadComments();
});

// 全局错误保护
window.addEventListener('error', function(e) {
  console.warn('页面错误:', e.message);
  return true;
});
window.addEventListener('unhandledrejection', function(e) {
  console.warn('Promise错误:', e.reason);
  e.preventDefault();
});
</script>
</body>
</html>

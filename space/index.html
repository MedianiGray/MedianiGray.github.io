<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟场域</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-glow: rgba(104,159,137,0.2);
  --bg: #050807;
  --text: #e8edf2;
  --text-dim: #7a8595;
  --border: rgba(255,255,255,0.08);
  --glass: rgba(255,255,255,0.04);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  overflow: hidden;
  height: 100vh;
}

#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 16px 24px;
  background: rgba(5,8,7,0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
}
.back-btn {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.back-btn:hover { color: var(--main); border-color: var(--main); }
.top-title {
  font-size: 1.1rem;
  font-weight: 600;
  background: linear-gradient(135deg, #fff, var(--main));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.toolbar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5,8,7,0.8);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  z-index: 100;
}
.tool-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--glass);
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: all 0.2s;
}
.tool-btn:hover { background: rgba(255,255,255,0.08); }
.tool-btn.active {
  background: var(--main-glow);
  border-color: var(--main);
  color: var(--main);
}

.color-picker {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.color-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.color-dot.active {
  border-color: white;
  transform: scale(1.15);
}

.size-slider {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
}
.size-slider input {
  width: 60px;
  accent-color: var(--main);
}

.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--main);
  color: white;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="toast" id="toast"></div>

<div class="top-bar">
  <a href="/home/" class="back-btn">← 返回门廊</a>
  <div class="top-title">虚拟场域</div>
</div>

<div class="toolbar">
  <div class="tool-btn active" id="brushBtn" onclick="setTool('brush')" title="画笔">✏️</div>
  <div class="tool-btn" id="eraserBtn" onclick="setTool('eraser')" title="橡皮">🧽</div>
  
  <div class="color-picker">
    <div class="color-dot active" style="background: #689F89" onclick="setColor(this, '#689F89')"></div>
    <div class="color-dot" style="background: #6496c8" onclick="setColor(this, '#6496c8')"></div>
    <div class="color-dot" style="background: #9a689f" onclick="setColor(this, '#9a689f')"></div>
    <div class="color-dot" style="background: #9a8f68" onclick="setColor(this, '#9a8f68')"></div>
    <div class="color-dot" style="background: #e8edf2" onclick="setColor(this, '#e8edf2')"></div>
  </div>

  <div class="size-slider">
    <span style="font-size:0.8rem; color:var(--text-dim)">大小</span>
    <input type="range" min="1" max="20" value="3" id="sizeInput">
  </div>

  <div class="tool-btn" onclick="clearCanvas()" title="清空">🗑️</div>
  <div class="tool-btn" onclick="saveCanvas()" title="保存">💾</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let isDrawing = false;
let currentTool = 'brush';
let currentColor = '#689F89';
let brushSize = 3;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function setTool(tool) {
  currentTool = tool;
  document.getElementById('brushBtn').classList.toggle('active', tool === 'brush');
  document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
  showToast(tool === 'brush' ? '画笔模式' : '橡皮模式');
}

function setColor(el, color) {
  currentColor = color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  if (currentTool === 'eraser') setTool('brush');
}

document.getElementById('sizeInput').addEventListener('input', (e) => {
  brushSize = parseInt(e.target.value);
});

canvas.addEventListener('mousedown', (e) => {
  isDrawing = true;
  ctx.beginPath();
  ctx.moveTo(e.clientX, e.clientY);
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  ctx.lineWidth = currentTool === 'eraser' ? brushSize * 3 : brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = currentTool === 'eraser' ? '#050807' : currentColor;
  ctx.lineTo(e.clientX, e.clientY);
  ctx.stroke();
});

canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  showToast('画布已清空');
}

function saveCanvas() {
  const link = document.createElement('a');
  link.download = 'virtual-space.png';
  link.href = canvas.toDataURL();
  link.click();
  showToast('已保存到本地');
}
</script>

</body>
</html>

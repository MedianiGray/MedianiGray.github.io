<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 大道元灵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-deep: #4E7A68;
  --main-glow: rgba(104, 159, 137, 0.3);
  --bg-primary: #161d1b;
  --bg-secondary: #1e2825;
  --bg-card: rgba(255, 255, 255, 0.05);
  --bg-card-hover: rgba(255, 255, 255, 0.08);
  --text-primary: #e8eaf0;
  --text-secondary: #9ba3b4;
  --text-muted: #6b7385;
  --border: rgba(255, 255, 255, 0.1);
  --danger: #e06c6c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px;
}
.back-link {
  display: inline-block;
  color: var(--text-muted);
  text-decoration: none;
  margin-bottom: 30px;
  font-size: 0.9rem;
}
.back-link:hover { color: var(--main); }
.profile-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  margin-bottom: 24px;
  text-align: center;
}
.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--main), var(--main-deep));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  color: white;
  margin: 0 auto 20px;
}
.username {
  font-size: 1.5rem;
  margin-bottom: 8px;
}
.bio {
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.8;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.stat-item {
  text-align: center;
}
.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--main);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 4px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 12px 24px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab.active {
  color: var(--main);
  border-bottom-color: var(--main);
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
.post-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
}
.post-item h4 {
  margin-bottom: 8px;
}
.post-item p {
  color: var(--text-secondary);
  font-size: 0.9rem;
}
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--main);
  color: white;
}
.btn-primary:hover {
  background: var(--main-deep);
}
.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.login-prompt {
  text-align: center;
  padding: 60px 20px;
}
.login-prompt h2 {
  margin-bottom: 16px;
}
.login-prompt p {
  color: var(--text-secondary);
  margin-bottom: 24px;
}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">← 返回首页</a>
  
  <div id="login-prompt" class="login-prompt" style="display:none;">
    <h2>请先登录</h2>
    <p>登录后查看个人中心</p>
    <a href="/admin/login.html" class="btn btn-primary">立即登录</a>
  </div>

  <div id="profile-content" style="display:none;">
    <div class="profile-card">
      <div class="avatar" id="avatar">👤</div>
      <h2 class="username" id="username">用户名</h2>
      <div id="role-badge" style="display:inline-block;padding:4px 12px;border-radius:100px;font-size:0.8rem;margin-bottom:12px;"></div>
      <p class="bio" id="bio">这个人很懒，什么都没写</p>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="stat-posts">0</div>
          <div class="stat-label">我的文章</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-comments">0</div>
          <div class="stat-label">我的评论</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-favorites">0</div>
          <div class="stat-label">我的收藏</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="posts">我的文章</div>
      <div class="tab" data-tab="comments">我的评论</div>
      <div class="tab" data-tab="favorites">我的收藏</div>
      <div class="tab" data-tab="settings">账号设置</div>
    </div>

    <div class="tab-content active" id="tab-posts">
      <div id="my-posts">
        <p style="color:var(--text-muted);text-align:center;padding:40px;">暂无文章</p>
      </div>
    </div>

    <div class="tab-content" id="tab-comments">
      <div id="my-comments">
        <p style="color:var(--text-muted);text-align:center;padding:40px;">暂无评论</p>
      </div>
    </div>

    <div class="tab-content" id="tab-favorites">
      <div id="my-favorites">
        <p style="color:var(--text-muted);text-align:center;padding:40px;">暂无收藏</p>
      </div>
    </div>

    <div class="tab-content" id="tab-settings">
      <div class="profile-card">
        <h3 style="margin-bottom:20px;">编辑资料</h3>
        <div style="text-align:left;max-width:400px;margin:0 auto;">
          <div style="margin-bottom:16px;">
            <label style="display:block;margin-bottom:8px;color:var(--text-secondary);">昵称</label>
            <input type="text" id="edit-username" style="width:100%;padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);">
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block;margin-bottom:8px;color:var(--text-secondary);">个人简介</label>
            <textarea id="edit-bio" style="width:100%;padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);min-height:80px;"></textarea>
          </div>
          <button class="btn btn-primary" onclick="saveProfile()">保存修改</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nxrinxhhuhtexfzkwxbu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VyMh9BT9Tzm6uhM-Mkj5UA_WHm6ITiW";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

// 检查登录状态
sb.auth.getSession().then(({ data: { session } }) => {
    if (session) {
        currentUser = session.user;
        document.getElementById('login-prompt').style.display = 'none';
        document.getElementById('profile-content').style.display = 'block';
        loadProfile();
    } else {
        document.getElementById('login-prompt').style.display = 'block';
        document.getElementById('profile-content').style.display = 'none';
    }
});

async function loadProfile() {
    try {
        const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
        if (profile) {
            document.getElementById('username').textContent = profile.username || currentUser.email;
            document.getElementById('bio').textContent = profile.bio || '这个人很懒，什么都没写';
            document.getElementById('edit-username').value = profile.username || '';
            document.getElementById('edit-bio').value = profile.bio || '';
            
            // 显示角色
            const roleBadge = document.getElementById('role-badge');
            const role = profile.role || 'user';
            if (role === 'super_admin') {
                roleBadge.textContent = '👑 超级管理员';
                roleBadge.style.background = 'rgba(255, 215, 0, 0.15)';
                roleBadge.style.color = '#ffd700';
            } else if (role === 'admin') {
                roleBadge.textContent = '⚙️ 管理员';
                roleBadge.style.background = 'rgba(104, 159, 137, 0.15)';
                roleBadge.style.color = 'var(--main)';
            } else {
                roleBadge.textContent = '👤 普通用户';
                roleBadge.style.background = 'rgba(255, 255, 255, 0.05)';
                roleBadge.style.color = 'var(--text-secondary)';
            }
        } else {
            document.getElementById('username').textContent = currentUser.email;
        }
    } catch(e) {
        console.log('加载资料失败:', e);
    }
}

async function saveProfile() {
    const username = document.getElementById('edit-username').value;
    const bio = document.getElementById('edit-bio').value;
    try {
        await sb.from('profiles').upsert({
            id: currentUser.id,
            username: username,
            bio: bio,
            updated_at: new Date().toISOString()
        });
        alert('✅ 资料已保存');
        loadProfile();
    } catch(e) {
        alert('❌ 保存失败: ' + e.message);
    }
}

// Tab切换
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});
</script>
</body>
</html>

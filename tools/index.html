<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>器用之辨</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --main: #689F89;
  --main-glow: rgba(104,159,137,0.2);
  --bg: #0a0f0e;
  --bg-card: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --text: #e8edf2;
  --text-dim: #7a8595;
  --border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  min-height: 100vh;
}

.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,15,14,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
}
.nav-left { display: flex; align-items: center; gap: 20px; }
.back-btn {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.back-btn:hover { color: var(--main); border-color: var(--main); }
.nav-title {
  font-size: 1.1rem;
  font-weight: 600;
  background: linear-gradient(135deg, #fff, var(--main));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.container {
  max-width: 1200px;
  margin: 84px auto 40px;
  padding: 0 24px;
}

.search-bar {
  position: relative;
  margin-bottom: 32px;
}
.search-bar input {
  width: 100%;
  padding: 16px 20px 16px 56px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  font-size: 1rem;
  outline: none;
  transition: all 0.2s;
}
.search-bar input:focus {
  border-color: var(--main);
  box-shadow: 0 0 0 3px var(--main-glow);
}
.search-bar::before {
  content: '🔍';
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
}

.categories {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.category-chip {
  padding: 8px 16px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.category-chip:hover { background: var(--bg-hover); }
.category-chip.active {
  background: var(--main);
  border-color: var(--main);
  color: white;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.tool-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.2s;
}
.tool-card:hover {
  background: var(--bg-hover);
  transform: translateY(-4px);
  border-color: var(--main);
}
.tool-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--main-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  margin-bottom: 16px;
}
.tool-card h3 {
  font-size: 1.1rem;
  margin-bottom: 8px;
}
.tool-card p {
  color: var(--text-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}
.tool-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 10px;
  background: var(--bg-hover);
  border-radius: 99px;
  font-size: 0.75rem;
  color: var(--main);
}

.tool-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(20px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.tool-modal.open { display: flex; }
.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.modal-header h2 {
  font-size: 1.3rem;
}
.close-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-hover);
  border: none;
  color: var(--text);
  cursor: pointer;
  font-size: 1.1rem;
}
.close-btn:hover { background: var(--border); }

.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--main);
  color: white;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 768px) {
  .tools-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav class="top-nav">
  <div class="nav-left">
    <a href="/home/" class="back-btn">← 返回门廊</a>
    <div class="nav-title">器用之辨</div>
  </div>
</nav>

<div class="container">
  <div class="search-bar">
    <input type="text" placeholder="搜索工具..." id="searchInput" oninput="filterTools()">
  </div>

  <div class="categories">
    <div class="category-chip active" onclick="filterCategory(this, 'all')">全部</div>
    <div class="category-chip" onclick="filterCategory(this, 'text')">文本</div>
    <div class="category-chip" onclick="filterCategory(this, 'dev')">开发</div>
    <div class="category-chip" onclick="filterCategory(this, 'util')">实用</div>
  </div>

  <div class="tools-grid" id="toolsGrid">
    <div class="tool-card" data-category="text" onclick="openTool('JSON格式化')">
      <div class="tool-icon">📋</div>
      <h3>JSON 格式化</h3>
      <p>美化、压缩、验证 JSON 数据，支持错误定位</p>
      <span class="tool-tag">文本处理</span>
    </div>

    <div class="tool-card" data-category="text" onclick="openTool('Base64编解码')">
      <div class="tool-icon">🔐</div>
      <h3>Base64 编解码</h3>
      <p>字符串与 Base64 互相转换，支持 UTF-8</p>
      <span class="tool-tag">文本处理</span>
    </div>

    <div class="tool-card" data-category="dev" onclick="openTool('URL编解码')">
      <div class="tool-icon">🔗</div>
      <h3>URL 编解码</h3>
      <p>URL 编码与解码，支持完整 URL 处理</p>
      <span class="tool-tag">开发工具</span>
    </div>

    <div class="tool-card" data-category="util" onclick="openTool('密码生成器')">
      <div class="tool-icon">🎲</div>
      <h3>密码生成器</h3>
      <p>自定义长度、字符集，生成安全随机密码</p>
      <span class="tool-tag">实用工具</span>
    </div>

    <div class="tool-card" data-category="dev" onclick="openTool('时间戳转换')">
      <div class="tool-icon">⏰</div>
      <h3>时间戳转换</h3>
      <p>Unix 时间戳与日期互相转换，支持毫秒</p>
      <span class="tool-tag">开发工具</span>
    </div>

    <div class="tool-card" data-category="text" onclick="openTool('字数统计')">
      <div class="tool-icon">📝</div>
      <h3>字数统计</h3>
      <p>实时统计字符数、单词数、阅读时长</p>
      <span class="tool-tag">文本处理</span>
    </div>
  </div>
</div>

<div class="tool-modal" id="toolModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">工具名称</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody">
      <p style="color: var(--text-dim);">工具功能开发中...</p>
    </div>
  </div>
</div>

<script>
let currentCategory = 'all';

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function filterCategory(el, category) {
  document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCategory = category;
  filterTools();
}

function filterTools() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.tool-card');
  
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    const category = card.dataset.category;
    const matchSearch = text.includes(search);
    const matchCategory = currentCategory === 'all' || category === currentCategory;
    card.style.display = (matchSearch && matchCategory) ? 'block' : 'none';
  });
}

function openTool(name) {
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('toolModal').classList.add('open');
}

function closeModal() {
  document.getElementById('toolModal').classList.remove('open');
}

document.getElementById('toolModal').addEventListener('click', (e) => {
  if (e.target.id === 'toolModal') closeModal();
});
</script>

</body>
</html>

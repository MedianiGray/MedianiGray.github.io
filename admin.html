<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元管理 · 大道元灵</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main: #689F89;
            --main-deep: #4E7A68;
            --main-glow: rgba(104, 159, 137, 0.3);
            --bg-primary: #161d1b;
            --bg-secondary: #1e2825;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7385;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #e06c6c;
            --warning: #e0b86c;
            --success: #6ce09a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 登录页面 */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--main);
        }
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .form-group textarea {
            min-height: 200px;
            font-family: monospace;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--main);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: var(--main);
            color: white;
        }
        .btn-primary:hover {
            background: var(--main-deep);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-danger {
            background: rgba(224, 108, 108, 0.15);
            color: var(--danger);
            border: 1px solid rgba(224, 108, 108, 0.3);
        }
        .btn-sm {
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            width: auto;
        }

        /* 主布局 */
        .admin-layout {
            display: none;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            z-index: 100;
        }
        .sidebar-logo {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .sidebar-logo h2 {
            font-size: 1.2rem;
            color: var(--main);
        }
        .sidebar-logo p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .nav-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: var(--main-glow);
            color: var(--main);
            border-right: 2px solid var(--main);
        }

        .main {
            margin-left: 240px;
            padding: 2rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.5rem;
        }
        .header .actions {
            display: flex;
            gap: 0.75rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--main);
        }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .table-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h3 {
            font-size: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.8rem;
        }
        tr:hover {
            background: var(--bg-card-hover);
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar-logo p, .nav-item span {
                display: none;
            }
            .main {
                margin-left: 60px;
                padding: 1rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div class="login-page" id="login-page">
        <div class="login-card">
            <h1>元管理</h1>
            <p>大道元灵 · 管理后台登录</p>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="login-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="login()">登录</button>
            <p style="margin-top:1rem;font-size:0.8rem;color:var(--text-muted);text-align:center;">
                还没有账号？<a href="#" onclick="toggleRegister()" style="color:var(--main);">注册</a>
            </p>
        </div>
    </div>

    <!-- 注册页面 -->
    <div class="login-page" id="register-page" style="display:none;">
        <div class="login-card">
            <h1>注册账号</h1>
            <p>创建管理员账号</p>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="reg-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="reg-password" placeholder="至少6位">
            </div>
            <button class="btn btn-primary" onclick="register()">注册</button>
            <p style="margin-top:1rem;font-size:0.8rem;color:var(--text-muted);text-align:center;">
                已有账号？<a href="#" onclick="toggleLogin()" style="color:var(--main);">登录</a>
            </p>
        </div>
    </div>

    <!-- 主管理后台 -->
    <div class="admin-layout" id="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>元管理</h2>
                <p>大道元灵 · 管理后台</p>
            </div>
            <nav>
                <div class="nav-item active" data-page="dashboard">
                    <span>📊</span><span>仪表盘</span>
                </div>
                <div class="nav-item" data-page="posts">
                    <span>📝</span><span>文章管理</span>
                </div>
                <div class="nav-item" data-page="pages">
                    <span>📄</span><span>页面内容</span>
                </div>
                <div class="nav-item" data-page="comments">
                    <span>💬</span><span>评论管理</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <span>⚙️</span><span>网站设置</span>
                </div>
                <div class="nav-item" onclick="logout()">
                    <span>🚪</span><span>退出登录</span>
                </div>
            </nav>
        </aside>

        <main class="main">
            <!-- 仪表盘 -->
            <div class="page active" id="page-dashboard">
                <div class="header">
                    <h1>仪表盘</h1>
                    <div class="actions">
                        <button class="btn btn-secondary btn-sm" onclick="loadAllData()">刷新</button>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">文章总数</div>
                        <div class="value" id="stat-posts">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">总访问量</div>
                        <div class="value" id="stat-visits">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">评论数</div>
                        <div class="value" id="stat-comments">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">总点赞</div>
                        <div class="value" id="stat-likes">-</div>
                    </div>
                </div>
            </div>

            <!-- 文章管理 -->
            <div class="page" id="page-posts">
                <div class="header">
                    <h1>文章管理</h1>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" onclick="openPostModal()">+ 新建文章</button>
                    </div>
                </div>
                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>标题</th>
                                <th>分类</th>
                                <th>浏览</th>
                                <th>日期</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="posts-body">
                            <tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 页面内容 -->
            <div class="page" id="page-pages">
                <div class="header">
                    <h1>页面内容</h1>
                </div>
                <div class="table-card" style="padding:2rem;">
                    <div id="pages-editor">
                        <p style="color:var(--text-muted)">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 评论管理 -->
            <div class="page" id="page-comments">
                <div class="header">
                    <h1>评论管理</h1>
                </div>
                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>昵称</th>
                                <th>内容</th>
                                <th>文章</th>
                                <th>时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="comments-body">
                            <tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 网站设置 -->
            <div class="page" id="page-settings">
                <div class="header">
                    <h1>网站设置</h1>
                </div>
                <div class="table-card" style="padding:2rem;">
                    <div id="settings-editor">
                        <p style="color:var(--text-muted)">加载中...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 文章编辑弹窗 -->
    <div class="modal" id="post-modal">
        <div class="modal-content">
            <h2 id="modal-title">编辑文章</h2>
            <input type="hidden" id="post-id">
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="post-title" placeholder="文章标题">
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="post-category" placeholder="分类">
            </div>
            <div class="form-group">
                <label>摘要</label>
                <input type="text" id="post-excerpt" placeholder="文章摘要">
            </div>
            <div class="form-group">
                <label>内容 (Markdown)</label>
                <textarea id="post-content" placeholder="支持Markdown语法"></textarea>
            </div>
            <div style="display:flex;gap:1rem;">
                <button class="btn btn-primary" onclick="savePost()">保存</button>
                <button class="btn btn-secondary" onclick="closePostModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nxrinxhhuhtexfzkwxbu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_VyMh9BT9Tzm6uhM-Mkj5UA_WHm6ITiW";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // 检查登录状态
        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                showAdmin();
                loadAllData();
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('register-page').style.display = 'none';
            document.getElementById('admin-layout').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('register-page').style.display = 'flex';
            document.getElementById('admin-layout').style.display = 'none';
        }

        function showAdmin() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('register-page').style.display = 'none';
            document.getElementById('admin-layout').style.display = 'block';
        }

        function toggleRegister() { showRegister(); }
        function toggleLogin() { showLogin(); }

        // 登录
        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                currentUser = data.user;
                showAdmin();
                loadAllData();
            } catch(e) {
                alert('登录失败: ' + e.message);
            }
        }

        // 注册
        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                const { data, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;
                alert('注册成功！请检查邮箱验证。');
                showLogin();
            } catch(e) {
                alert('注册失败: ' + e.message);
            }
        }

        // 退出
        async function logout() {
            await sb.auth.signOut();
            currentUser = null;
            showLogin();
        }

        // 页面切换
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.getAttribute('onclick')) return;
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                if (!page) return;
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');

                if (page === 'posts') loadPosts();
                if (page === 'comments') loadComments();
                if (page === 'pages') loadPages();
                if (page === 'settings') loadSettings();
            });
        });

        // 加载所有数据
        async function loadAllData() {
            loadStats();
            loadPosts();
            loadComments();
        }

        // 加载统计
        async function loadStats() {
            try {
                const { count: postCount } = await sb.from('posts').select('*', { count: 'exact', head: true });
                document.getElementById('stat-posts').textContent = postCount || 0;

                const { count: visitCount } = await sb.from('visits').select('*', { count: 'exact', head: true });
                document.getElementById('stat-visits').textContent = visitCount || 0;

                const { count: commentCount } = await sb.from('comments').select('*', { count: 'exact', head: true });
                document.getElementById('stat-comments').textContent = commentCount || 0;
            } catch(e) {
                console.log('统计加载失败:', e);
            }
        }

        // 加载文章
        async function loadPosts() {
            const tbody = document.getElementById('posts-body');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>';
            try {
                const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">暂无文章</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(post => {
                    const tr = document.createElement('tr');
                    const date = new Date(post.created_at).toLocaleDateString('zh-CN');
                    tr.innerHTML = `
                        <td>${post.title}</td>
                        <td>${post.category}</td>
                        <td>${post.views || 0}</td>
                        <td>${date}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick='editPost(${JSON.stringify(post)})'>编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deletePost('${post.id}')">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger)">加载失败: ' + e.message + '</td></tr>';
            }
        }

        // 打开新建文章弹窗
        function openPostModal() {
            document.getElementById('modal-title').textContent = '新建文章';
            document.getElementById('post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('post-excerpt').value = '';
            document.getElementById('post-content').value = '';
            document.getElementById('post-modal').classList.add('active');
        }

        // 编辑文章
        function editPost(post) {
            document.getElementById('modal-title').textContent = '编辑文章';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-category').value = post.category || '';
            document.getElementById('post-excerpt').value = post.excerpt || '';
            document.getElementById('post-content').value = post.content;
            document.getElementById('post-modal').classList.add('active');
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.remove('active');
        }

        // 保存文章
        async function savePost() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            const excerpt = document.getElementById('post-excerpt').value;
            const content = document.getElementById('post-content').value;

            if (!title || !content) {
                alert('标题和内容不能为空');
                return;
            }

            const slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');

            try {
                if (id) {
                    await sb.from('posts').update({ title, category, excerpt, content, updated_at: new Date().toISOString() }).eq('id', id);
                } else {
                    await sb.from('posts').insert([{ title, slug, category, excerpt, content }]);
                }
                closePostModal();
                loadPosts();
                alert('保存成功');
            } catch(e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 删除文章
        async function deletePost(id) {
            if (!confirm('确定删除这篇文章？')) return;
            try {
                await sb.from('posts').delete().eq('id', id);
                loadPosts();
                loadStats();
            } catch(e) {
                alert('删除失败: ' + e.message);
            }
        }

        // 加载评论
        async function loadComments() {
            const tbody = document.getElementById('comments-body');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>';
            try {
                const { data, error } = await sb.from('comments').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">暂无评论</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(comment => {
                    const tr = document.createElement('tr');
                    const date = new Date(comment.created_at).toLocaleString('zh-CN');
                    tr.innerHTML = `
                        <td>${comment.author || '匿名'}</td>
                        <td>${(comment.content || '').substring(0, 50)}</td>
                        <td>${comment.post_path || ''}</td>
                        <td>${date}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="deleteComment('${comment.id}')">删除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger)">加载失败</td></tr>';
            }
        }

        async function deleteComment(id) {
            if (!confirm('确定删除这条评论？')) return;
            await sb.from('comments').delete().eq('id', id);
            loadComments();
        }

        // 加载页面内容
        async function loadPages() {
            const container = document.getElementById('pages-editor');
            try {
                const { data, error } = await sb.from('pages').select('*');
                if (error) throw error;

                container.innerHTML = '';
                data.forEach(page => {
                    const card = document.createElement('div');
                    card.style.cssText = 'margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border);';
                    card.innerHTML = `
                        <h3 style="margin-bottom:1rem;">${page.page_key}</h3>
                        <pre style="background:var(--bg-primary);padding:1rem;border-radius:8px;overflow-x:auto;font-size:0.85rem;">${JSON.stringify(page.content, null, 2)}</pre>
                    `;
                    container.appendChild(card);
                });
            } catch(e) {
                container.innerHTML = '<p style="color:var(--danger)">加载失败</p>';
            }
        }

        // 加载网站设置
        async function loadSettings() {
            const container = document.getElementById('settings-editor');
            try {
                const { data, error } = await sb.from('site_settings').select('*');
                if (error) throw error;

                container.innerHTML = '<div style="max-width:600px;">';
                data.forEach(setting => {
                    const item = document.createElement('div');
                    item.style.cssText = 'margin-bottom:1.5rem;';
                    item.innerHTML = `
                        <label style="display:block;margin-bottom:0.5rem;color:var(--text-secondary);font-size:0.9rem;">${setting.key}</label>
                        <input type="text" value="${setting.value}" data-key="${setting.key}" style="width:100%;padding:0.75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);">
                    `;
                    container.appendChild(item);
                });
                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn btn-primary';
                saveBtn.textContent = '保存设置';
                saveBtn.onclick = saveSettings;
                container.appendChild(saveBtn);
                container.innerHTML += '</div>';
            } catch(e) {
                container.innerHTML = '<p style="color:var(--danger)">加载失败</p>';
            }
        }

        async function saveSettings() {
            const inputs = document.querySelectorAll('#settings-editor input');
            try {
                for (const input of inputs) {
                    const key = input.dataset.key;
                    const value = input.value;
                    await sb.from('site_settings').update({ value }).eq('key', key);
                }
                alert('设置已保存');
            } catch(e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 初始化
        checkAuth();
    </script>
</body>
</html>

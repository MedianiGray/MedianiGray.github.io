<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="refresh" content="0;url=/admin/">
    <title>正在跳转...</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #0a0f0e; color: #e8edf2; font-family: sans-serif; }
        .loading { text-align: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(104,159,137,0.2); border-top-color: #689F89; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>正在跳转到管理后台...</p>
    </div>
    <script>
        // 立即跳转，不等待
        window.location.replace('/admin/');
    </script>
</body>
</html>
